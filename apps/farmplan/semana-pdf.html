<!DOCTYPE html>
<!-- FARM PLAN · Gesta'Up · PDF do Plano Semanal (para mandar no WhatsApp) -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano Semanal · Farm Plan</title>
  <link rel="icon" href="symbol.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
  <style>
    .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .folha{--az:#0E3A55;--vd:#20A44B;--ln:#D5DBDF;background:#fff;color:#16232A;max-width:820px;margin:0 auto;padding:22px 26px;border:1px solid var(--ln);font-family:"Public Sans",Arial,sans-serif;font-size:11px;box-shadow:var(--shadow)}
    .folha .faixa{height:6px;background:linear-gradient(90deg,var(--az) 0 75%,var(--vd) 75%);margin:-22px -26px 14px}
    .folha .cab{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--az);padding-bottom:10px}
    .folha .cab img{height:46px}
    .folha .cab h1{font-family:"Archivo",Arial,sans-serif;font-size:20px;margin:0;color:var(--az);letter-spacing:-.01em}
    .folha .cab small{display:block;color:#5B6B75;font-size:11.5px;margin-top:2px}
    .folha .recado{margin:12px 0 4px;background:#EEF6F0;border-left:4px solid var(--vd);padding:8px 12px;font-size:12px}
    .folha .grupo{margin-top:12px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
    .folha .gt{display:flex;justify-content:space-between;align-items:center;background:var(--az);color:#fff;padding:7px 12px}
    .folha .gt{break-after:avoid;page-break-after:avoid}.folha .row,.folha .dia .it,.folha .kp,.folha .carga{break-inside:avoid;page-break-inside:avoid}
    .folha .gt b{font-size:13.5px}.folha .gt span{font-size:10.5px;opacity:.9}
    .folha .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
    .folha .kp div{border:1px solid var(--ln);border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:8px}
    .folha .kp b{font-family:"Archivo",Arial,sans-serif;font-size:20px;color:var(--az);line-height:1}
    .folha .kp small{font-size:10px;color:#5B6B75;line-height:1.2}
    .folha .kp .r{background:#FBECEA;border-color:#E9B3AB}.folha .kp .r b{color:#C23D2B}
    .folha .kp .a{background:#E8F1FA;border-color:#A9C8E6}.folha .kp .a b{color:#2B6CB0}
    .folha .carga{margin-top:10px;border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
    .folha .carga h3,.folha .sec{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5B6B75;margin:0 0 6px;font-weight:700}
    .folha .cd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
    .folha .cd div{text-align:center;font-size:10px;color:#5B6B75}
    .folha .cd i{display:block;background:var(--vd);border-radius:3px 3px 0 0;margin:2px auto 3px;width:70%;min-height:2px}
    .folha .cd b{display:block;color:#16232A;font-size:12px}
    .folha .leg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0 0;font-size:10px;color:#5B6B75}
    .folha .leg span{display:inline-flex;align-items:center;gap:5px}
    .folha .row{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid #ECEFF1}
    .folha .row:first-of-type{border-top:0}
    .folha .row.atr{background:#FFF6F5;box-shadow:inset 3px 0 0 #C23D2B}
    .folha .row.and{box-shadow:inset 3px 0 0 #2B6CB0}
    .folha .nm{flex:1;min-width:0}
    .folha .nm b{display:block;font-size:11.5px}
    .folha .nm small{color:#6E787C;font-size:9.5px}
    .folha .qf{font-size:10px;color:#16232A;width:110px;font-weight:600}
    .folha .dias{display:flex;gap:3px;flex:none}
    .folha .dd{width:34px;white-space:nowrap;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;letter-spacing:.02em}
    .folha .dd.s{background:var(--az);color:#fff}
    .folha .dd.f{background:var(--vd);color:#fff}
    .folha .dd.x{background:#C23D2B;color:#fff}
    .folha .dd.p{background:#FFF1D6;color:#9A6400;box-shadow:inset 0 0 0 1px #E8B04A}
    .folha .dd.n{background:#F2F4F5;color:#C3CBD0}
    .folha .vz{width:58px;text-align:right;font-size:9.5px;color:#5B6B75;flex:none}
    .folha .tg{display:inline-block;border-radius:3px;padding:1px 5px;font-size:8.5px;font-weight:700;margin-left:6px;vertical-align:1px;color:#fff}
    .folha .tg.r{background:#C23D2B}.folha .tg.a{background:#2B6CB0}.folha .tg.v{background:var(--vd)}
    .folha .dia{margin-top:12px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
    .folha .dia .gt{background:var(--vd)}
    .folha .dia .lst{display:grid;grid-template-columns:1fr 1fr}
    .folha .dia .it{padding:5px 12px;border-top:1px solid #ECEFF1;display:flex;gap:8px;align-items:baseline}
    .folha .dia .it .q{font-weight:700;color:var(--az);font-size:10px;width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .folha .dia .it .nm b{font-size:11px}
    .folha .rod{margin-top:16px;display:flex;justify-content:space-between;color:#6E787C;font-size:9.5px;border-top:1px solid var(--ln);padding-top:6px}
    @media (max-width:700px){.folha{padding:14px}.folha .kp{grid-template-columns:repeat(2,1fr)}.folha .row{flex-wrap:wrap}.folha .dd{width:26px}.folha .dia .lst{grid-template-columns:1fr}.folha .qf{width:auto}}
    @media print{
      @page{size:A4 portrait;margin:9mm}
      body{background:#fff!important}
      .side,.mtop,.phead,.barra,.toast,#aviso{display:none!important}
      .shell{display:block}.main{padding:0!important}
      .folha{box-shadow:none;border:0;max-width:none;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .folha .faixa{margin:0 0 12px}
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="lg"><img src="logo.png" alt="Gesta'Up Company"></div><div><b>Farm Plan</b><span>Gesta'Up · Gestão 360°</span></div></div>
    <div class="farm">Fazenda<b id="nomeFazenda">—</b></div>
    <nav class="nav" id="menu"></nav>
    <div class="me"><div class="av" id="iniciais">—</div><div><b id="meuNome">—</b><span id="meuPapel"></span></div><button id="sair">Sair</button></div>
  </aside>
  <div class="main">
    <div class="mtop"><b><img src="icon-192.png" alt="">Farm Plan</b><select id="mnav"><option value="semana-pdf.html" selected>PDF da Semana</option><option value="index.html">Tarefas da Semana</option></select></div>
    <div class="phead"><div><div class="eyebrow">Para Mandar no Grupo do WhatsApp</div><h1>PDF do Plano Semanal</h1></div></div>
    <div id="aviso" class="empty">Carregando…</div>
    <div class="barra escondido" id="barra">
      <label class="sel">Semana<select id="sem"></select></label>
      <label class="sel">Para Quem<select id="quem"></select></label>
      <label class="sel">Agrupar Por<select id="agr"><option value="quem">Quem Faz</option><option value="dia">Dia (Agenda)</option><option value="setor">Setor</option></select></label>
      <label class="sel" style="padding:7px 10px;gap:6px"><input type="checkbox" id="semLocal"> Esconder Local</label>
      <button class="btn dark" id="pdf">📄 Gerar PDF</button>
      <button class="btn" data-xls="1">📊 Excel</button>
      <a class="btn" href="index.html" style="text-decoration:none;color:inherit">‹ Voltar</a>
    </div>
    <div id="folha"></div>
  </div>
</div>
<script type="module">
  import { supabase, ANO, SEMANAS_NO_ANO, PAPEL, DIAS_CURTO, DIAS_LONGO, tc, esc, semanaDe, quemSouEu, buscarTudo, montarMenu, periodoDaSemana, diaDaSemana, ddmm } from './comum.js';
  const $ = (id) => document.getElementById(id);
  const PODE = ['consultor', 'gestor', 'administrativo', 'lider'];
  const HOJE = semanaDe(new Date());
  let baixas = {}, eu, fz, fazenda = {}, pessoas = [], equipes = [], setores = [], membros = [], linhas = [];

  $('sair').onclick = async () => { await supabase.auth.signOut(); location.href = 'index.html'; };
  const nomeP = (id) => tc(pessoas.find(p => p.id === id)?.apelido || '');
  const nomeE = (id) => tc(equipes.find(e => e.id === id)?.nome || '');
  const nomeS = (id) => tc(setores.find(s => s.id === id)?.nome || 'Sem Setor');

  async function base() {
    [pessoas, equipes, setores, membros] = await Promise.all([
      buscarTudo(() => supabase.from('pessoas').select('id, apelido, ativo').eq('fazenda_id', fz).order('apelido')),
      buscarTudo(() => supabase.from('equipes').select('id, nome, lider_id').eq('fazenda_id', fz).order('nome')),
      buscarTudo(() => supabase.from('setores').select('id, nome').eq('fazenda_id', fz).order('nome')),
      buscarTudo(() => supabase.from('equipe_membros').select('equipe_id, pessoa_id, equipes!inner(fazenda_id)').eq('equipes.fazenda_id', fz))
    ]);
    const { data: f } = await supabase.from('fazendas').select('*').eq('id', fz).single(); fazenda = f || {};
    const pedida = +new URLSearchParams(location.search).get('semana') || HOJE;
    let o = ''; for (let w = Math.max(1, HOJE - 4); w <= Math.min(SEMANAS_NO_ANO, HOJE + 4); w++) o += `<option value="${w}" ${w === pedida ? 'selected' : ''}>Semana ${w} · ${periodoDaSemana(w)}</option>`;
    $('sem').innerHTML = o;
    $('quem').innerHTML = '<option value="">Fazenda Inteira</option>'
      + '<optgroup label="Equipes">' + equipes.map(e => `<option value="e:${e.id}">${esc(tc(e.nome))}</option>`).join('') + '</optgroup>'
      + '<optgroup label="Setores">' + setores.map(s => `<option value="s:${s.id}">${esc(tc(s.nome))}</option>`).join('') + '</optgroup>'
      + '<optgroup label="Pessoas">' + pessoas.filter(p => p.ativo).map(p => `<option value="p:${p.id}">${esc(tc(p.apelido))}</option>`).join('') + '</optgroup>';
    $('aviso').classList.add('escondido'); $('barra').classList.remove('escondido');
    await carregar();
  }
  async function carregar() {
    const w = +$('sem').value;
    const pl = await buscarTudo(() => supabase.from('planejamento')
      .select('status, observacao, atividades(id, nome, dias, local, setor_id, coordenador_id, executor_pessoa_id, executor_equipe_id)')
      .eq('fazenda_id', fz).eq('ano', ANO).eq('semana', w));
    const bx = await buscarTudo(() => supabase.from('baixas').select('atividade_id, dia, feito').eq('fazenda_id', fz).eq('ano', ANO).eq('semana', w)).catch(() => []);
    baixas = {}; bx.forEach(b => { baixas[b.atividade_id + '|' + b.dia] = b.feito; });
    linhas = pl.filter(l => l.atividades && l.status !== 5);   // pausadas não vão para o PDF
    desenhar();
    if (new URLSearchParams(location.search).get('excel') && !window._xlsFeito) { window._xlsFeito = true; setTimeout(() => document.querySelector('[data-xls]')?.click(), 300); }
  }

  function filtrar() {
    const q = $('quem').value;
    if (!q) return linhas;
    const [t, id] = q.split(':');
    if (t === 's') return linhas.filter(l => l.atividades.setor_id === id);
    if (t === 'e') return linhas.filter(l => l.atividades.executor_equipe_id === id);
    // Pessoa: as dela + as das equipes em que está
    const eqs = membros.filter(m => m.pessoa_id === id).map(m => m.equipe_id);
    return linhas.filter(l => l.atividades.executor_pessoa_id === id || eqs.includes(l.atividades.executor_equipe_id));
  }

  const atras = (l) => l.status === 4 || (l.observacao || '').startsWith('Atrasada');
  const quemDe = (a) => nomeP(a.executor_pessoa_id) || nomeE(a.executor_equipe_id) || 'Sem Responsável';
  const TAG = (l) => atras(l) ? '<span class="tg r">↻ Atrasada</span>' : l.status === 3 ? '<span class="tg a">Em Andamento</span>' : l.status === 2 ? '<span class="tg v">✓ Concluída</span>' : '';
  const CLS = (l) => atras(l) ? 'atr' : l.status === 3 ? 'and' : l.status === 2 ? 'ok' : '';
  // Cor de cada dia: o que aconteceu de verdade (baixas do aplicativo)
  const hoje0 = new Date(); hoje0.setHours(0, 0, 0, 0);
  const estadoDia = (a, w, i) => { if (!a.dias?.[i]) return ['n', '']; const b = baixas[a.id + '|' + i];
    if (b === true) return ['f', '✓ Feito']; if (b === false) return ['x', '✗ Não Deu'];
    return diaDaSemana(w, i) < hoje0 ? ['p', 'Passou sem Baixa'] : ['s', 'A Fazer']; };
  const freq = (a) => { const n = (a.dias || []).filter(Boolean).length; return n === 7 ? 'Todo Dia' : n ? n + 'x na Sem.' : 'Sem Dia'; };
  let excelLinhas = [];

  function desenhar() {
    const w = +$('sem').value, L = filtrar(), modo = $('agr').value, porSetor = modo === 'setor', semLocal = $('semLocal').checked;
    const titulo = $('quem').value ? $('quem').selectedOptions[0].textContent : 'Fazenda Inteira';
    const porDia = DIAS_CURTO.map((_, i) => L.filter(l => l.atividades.dias?.[i]));
    const tarefas = porDia.reduce((n, d) => n + d.length, 0), mx = Math.max(1, ...porDia.map(d => d.length));
    const nAtr = L.filter(atras).length, nAnd = L.filter(l => l.status === 3).length;
    const sub = (a, comQuem) => [comQuem ? quemDe(a) : '', semLocal ? '' : tc(a.local || ''), a.coordenador_id ? 'Coordena: ' + nomeP(a.coordenador_id) : ''].filter(Boolean).join(' · ');
    const ordena = (arr) => arr.sort((a, b) => (atras(b) - atras(a)) || a.atividades.nome.localeCompare(b.atividades.nome, 'pt'));
    const linha = (l, comQuem) => { const a = l.atividades;
      return `<div class="row ${CLS(l)}"><div class="nm"><b>${esc(tc(a.nome))}${TAG(l)}</b>${sub(a, comQuem) ? `<small>${esc(sub(a, comQuem))}</small>` : ''}</div>
        <div class="dias">${DIAS_CURTO.map((d, i) => { const [c, t] = estadoDia(a, w, i); return `<span class="dd ${c}" title="${t}">${c === 'f' ? '✓ ' : c === 'x' ? '✗ ' : ''}${d.toUpperCase()}</span>`; }).join('')}</div><div class="vz">${freq(a)}</div></div>`; };
    let corpo = '';
    if (modo === 'dia') {
      corpo = porDia.map((arr, i) => !arr.length ? '' : `<div class="dia"><div class="gt"><b>${DIAS_LONGO[i]} · ${ddmm(diaDaSemana(w, i))}</b><span>${arr.length} ${arr.length === 1 ? 'Tarefa' : 'Tarefas'}</span></div>
        <div class="lst">${[...arr].sort((x, y) => (atras(y) - atras(x)) || quemDe(x.atividades).localeCompare(quemDe(y.atividades), 'pt') || x.atividades.nome.localeCompare(y.atividades.nome, 'pt')).map(l => { const a = l.atividades; const sb = semLocal ? '' : tc(a.local || '');
          return `<div class="it ${CLS(l)}"><span class="q">${esc(quemDe(a))}</span><div class="nm"><b>${esc(tc(a.nome))}${TAG(l)}</b>${sb ? `<small>${esc(sb)}</small>` : ''}</div></div>`; }).join('')}</div></div>`).join('');
    } else {
      const grupos = {};
      L.forEach(l => { const a = l.atividades, k = porSetor ? nomeS(a.setor_id) : quemDe(a); (grupos[k] ||= []).push(l); });
      corpo = Object.entries(grupos).sort((x, y) => x[0].localeCompare(y[0], 'pt')).map(([k, arr]) => {
        const lider = !porSetor && equipes.find(e => tc(e.nome) === k)?.lider_id;
        const tg = arr.reduce((n, l) => n + (l.atividades.dias || []).filter(Boolean).length, 0);
        return `<div class="grupo"><div class="gt"><b>${esc(k)}</b><span>${arr.length} ${arr.length === 1 ? 'Atividade' : 'Atividades'} · ${tg} ${tg === 1 ? 'Tarefa' : 'Tarefas'} na Semana${lider ? ' · Líder: ' + esc(nomeP(lider)) : ''}</span></div>
          ${ordena(arr).map(l => linha(l, porSetor)).join('')}</div>`; }).join('');
    }
    $('folha').innerHTML = `<div class="folha"><div class="faixa"></div>
      <div class="cab"><img src="logo.png" alt=""><div style="flex:1"><h1>Plano Semanal · Semana ${w}</h1><small>${esc(tc(fazenda.nome || ''))} · ${periodoDaSemana(w)} · ${esc(titulo)}</small></div><span class="fpmark"><img src="icon-192.png" alt="Farm Plan"></span></div>
      ${fazenda.recado ? `<div class="recado"><b>Recado da Semana:</b> ${esc(fazenda.recado)}</div>` : ''}
      <div class="kp"><div><b>${L.length}</b><small>Atividades<br>na Semana</small></div><div><b>${tarefas}</b><small>Tarefas<br>(Somando os Dias)</small></div>
        <div class="r"><b>${nAtr}</b><small>Atrasadas<br>(Fazer Primeiro)</small></div><div class="a"><b>${nAnd}</b><small>Em<br>Andamento</small></div></div>
      <div class="carga"><h3>Tarefas por Dia</h3><div class="cd">${porDia.map((d, i) => `<div><b>${d.length}</b><i style="height:${Math.round(d.length / mx * 34)}px"></i>${DIAS_CURTO[i]} ${ddmm(diaDaSemana(w, i)).slice(0, 5)}</div>`).join('')}</div></div>
      <div class="leg"><b style="color:#16232A">Como Ler:</b><span><span class="dd s">SEG</span> A Fazer</span><span><span class="dd f">✓ SEG</span> Feito</span><span><span class="dd x">✗ SEG</span> Não Deu</span><span><span class="dd p">SEG</span> Passou sem Baixa</span><span><span class="dd n">TER</span> Não É Dia Dela</span><span><span class="tg r" style="margin:0">↻ Atrasada</span> Veio da Semana Anterior</span><span><span class="tg a" style="margin:0">Em Andamento</span> Começou e Ainda Não Terminou</span></div>
      ${corpo || '<div class="empty">Nada Planejado para Esta Seleção.</div>'}
      <div class="rod"><span>Dê Baixa no Aplicativo: farmplan-lime.vercel.app</span><span>Farm Plan · Gesta'Up</span></div></div>`;
    excelLinhas = [['Atividade', 'Quem Faz', 'Setor', 'Local', 'Coordena', 'Situação', ...DIAS_CURTO, 'Vezes na Semana'],
      ...ordena([...L]).map(l => { const a = l.atividades; return [tc(a.nome), quemDe(a), nomeS(a.setor_id), tc(a.local || ''), a.coordenador_id ? nomeP(a.coordenador_id) : '',
        atras(l) ? 'Atrasada' : l.status === 3 ? 'Em Andamento' : l.status === 2 ? 'Concluída' : 'Planejada', ...DIAS_CURTO.map((_, i) => ({ f: 'Feito', x: 'Não Deu', p: 'Sem Baixa', s: 'A Fazer', n: '' })[estadoDia(a, w, i)[0]]), (a.dias || []).filter(Boolean).length]; })];
  }
  $('sem').onchange = carregar; $('quem').onchange = desenhar; $('agr').onchange = desenhar; $('semLocal').onchange = desenhar;
  $('pdf').onclick = () => {
    const t = document.title; document.title = `Plano Semana ${$('sem').value} - ${$('quem').value ? $('quem').selectedOptions[0].textContent : tc(fazenda.nome || '')}`;
    setTimeout(() => { print(); document.title = t; }, 100);
  };

  eu = await quemSouEu();
  montarMenu('index.html');
  if (!eu) location.href = 'index.html';
  else if (!eu.fazenda || !PODE.includes(eu.papel)) $('aviso').textContent = 'O PDF da Semana é para Gestor, Administrativo, Consultor e Líder.';
  else {
    fz = eu.fazenda.id;
    $('nomeFazenda').textContent = tc(eu.fazenda.nome).replace(/^Fazenda /, '');
    const { data: eup } = await supabase.from('pessoas').select('apelido').eq('user_id', eu.user.id).maybeSingle();
    const nome = tc(eup?.apelido || eu.user.email.split('@')[0].split('+').pop());
    $('meuNome').textContent = nome; $('meuPapel').textContent = PAPEL[eu.papel] || '';
    $('iniciais').textContent = nome.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
    await base();
  }

  // 📊 Excel do relatório (o mesmo conteúdo do PDF, com números de verdade)
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-xls]'); if (!b) return; b.disabled = true; const txt = b.textContent; b.textContent = 'Montando…';
    import('./excel.js').then(m => m.exportarExcel({ semTabelas: true, extras: [{ nome: 'Plano da Semana', linhas: excelLinhas }], titulo: `Plano Semana ${$('sem').value} - ${$('quem').value ? $('quem').selectedOptions[0].textContent : tc(fazenda.nome || '')}` })).catch(er => alert(er.message)).finally(() => { b.disabled = false; b.textContent = txt; }); });
</script>
</body>
</html>
