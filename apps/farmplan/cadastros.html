<!DOCTYPE html>
<!-- FARM PLAN · Gesta'Up · Cadastros Gerais (setores, colaboradores, acessos e equipes) — visual do protótipo -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastros · Farm Plan</title>
  <link rel="icon" href="symbol.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="lg"><img src="logo.png" alt="Gesta'Up Company"></div><div><b>Farm Plan</b><span>Gesta'Up · Gestão 360°</span></div></div>
    <div class="farm">Fazenda<b id="nomeFazenda">—</b></div>
    <nav class="nav" id="menu"></nav>
    <div class="me"><div class="av" id="iniciais">—</div><div><b id="meuNome">—</b><span id="meuPapel"></span></div><button id="sair">Sair</button></div>
  </aside>
  <div class="main">
    <div class="mtop"><b><img src="icon-192.png" alt="">Farm Plan</b><select id="mnav"><option value="cadastros.html" selected>Cadastros</option><option value="index.html">Tarefas da Semana</option><option value="plano.html">Plano Anual</option><option value="avaliacao.html">Avaliação de Desempenho</option></select></div>
    <div id="aviso" class="empty">Carregando…</div>
    <section id="tela" class="escondido">
      <div class="phead">
        <div><div class="eyebrow">O Que Hoje Fica nas Abas Cadastros, Equipe e Cargos e Funções da Planilha</div><h1>Cadastros Gerais</h1></div>
        <div class="tabs" id="abas" style="margin:0"></div>
        <div class="acts" id="acaoTopo"></div>
      </div>
      <div id="conteudo"></div>
    </section>
  </div>
</div>
<div id="modal"></div>

<script type="module">
  import { supabase, INDICADORES_CATALOGO, PERIODOS_AVAL, ANO, PAPEL, STATUS, TIPOS, DIAS_CURTO, tc, esc, semanaDe, quemSouEu, buscarTudo, montarMenu } from './comum.js';
  const $ = (id) => document.getElementById(id);
  const PODE_VER = ['consultor', 'gestor', 'administrativo'];
  const PERFIS = [['colaborador','Colaborador'],['lider','Líder'],['administrativo','Administrativo'],['gestor','Gestor']];
  const SITE = 'farmplan-lime.vercel.app';
  const SEMANA = semanaDe(new Date());
  const ABAS = [['geral','Geral e Setores'],['biblioteca','Biblioteca de Atividades'],['cincom','5M das Atividades'],['colab','Colaboradores'],['funcoes','Funções'],['cargos','Cargos'],['criterios','Comportamentos'],['equipes','Equipes do App'],['indicadores','Indicadores'],['dados','Dados']];
  let criterios = [], contrato = [], funcoes = [], cargos = [], remun = {};
  let eu, fazenda, pessoas = [], setores = [], equipes = [], membros = [], atividades = [], naSemana = {}, acessos = {}, podeCriar = false;
  let aba = 'colab';
  try { aba = localStorage.getItem('fp-cad-aba') || 'colab'; } catch {}
  aba = new URLSearchParams(location.search).get('aba') || aba;

  function aviso(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
  const semAcento = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  const senhaNova = () => String(Math.floor(100000 + Math.random() * 900000));
  const nomeSetor = (id) => tc(setores.find(s => s.id === id)?.nome) || '—';
  const nomePessoa = (id) => tc(pessoas.find(p => p.id === id)?.apelido) || '—';
  const opcoesPessoas = (sel, vazio = '—') => `<option value="">${vazio}</option>` + pessoas.filter(p => p.ativo).map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(tc(p.apelido))}</option>`).join('');
  const erroBonito = (m) => /duplicate|unique/i.test(m) ? 'Já Existe um Cadastro com Esse Nome.' : /foreign key|violates/i.test(m) ? 'Não Dá para Apagar: Está em Uso em Atividades ou Equipes.' : 'Erro: ' + m;
  $('sair').onclick = async () => { await supabase.auth.signOut(); location.href = 'index.html'; };

  async function carregar() {
    const fz = fazenda.id;
    const [p, s, e, m, a, pl, cr, ct, fn, cg, rm] = await Promise.all([
      buscarTudo(() => supabase.from('pessoas').select('*').eq('fazenda_id', fz).order('apelido')),
      buscarTudo(() => supabase.from('setores').select('*').eq('fazenda_id', fz).order('nome')),
      buscarTudo(() => supabase.from('equipes').select('*').eq('fazenda_id', fz).order('nome')),
      buscarTudo(() => supabase.from('equipe_membros').select('equipe_id, pessoa_id, equipes!inner(fazenda_id)').eq('equipes.fazenda_id', fz)),
      buscarTudo(() => supabase.from('atividades').select('id, nome, setor_id, executor_pessoa_id, executor_equipe_id').eq('fazenda_id', fz)),
      buscarTudo(() => supabase.from('planejamento').select('atividade_id').eq('fazenda_id', fz).eq('ano', ANO).eq('semana', SEMANA)),
      buscarTudo(() => supabase.from('criterios').select('*').eq('fazenda_id', fz).order('nome')).catch(() => []),
      buscarTudo(() => supabase.from('contrato_itens').select('*').eq('fazenda_id', fz).order('ordem')).catch(() => []),
      buscarTudo(() => supabase.from('funcoes').select('*').eq('fazenda_id', fz).order('nome')).catch(() => []),
      buscarTudo(() => supabase.from('cargos').select('*').eq('fazenda_id', fz).order('nome')).catch(() => []),
      buscarTudo(() => supabase.from('remuneracao').select('*').eq('fazenda_id', fz)).catch(() => [])
    ]);
    criterios = cr; contrato = ct; funcoes = fn; cargos = cg; remun = {}; rm.forEach(x => remun[x.pessoa_id] = x);
    pessoas = p; setores = s; equipes = e; membros = m; atividades = a;
    naSemana = {}; pl.forEach(x => { const at = a.find(y => y.id === x.atividade_id); if (at?.setor_id) naSemana[at.setor_id] = (naSemana[at.setor_id] || 0) + 1; });
    acessos = {};
    if (podeCriar) (await buscarTudo(() => supabase.from('acessos').select('user_id, papel').eq('fazenda_id', fz))).forEach(x => acessos[x.user_id] = x.papel);
    $('aviso').classList.add('escondido'); $('tela').classList.remove('escondido');
    desenhar();
  }

  function desenhar() {
    $('abas').innerHTML = ABAS.map(([k, n, breve]) => `<button data-aba="${k}" class="${aba === k ? 'on' : ''}">${n}${breve ? '<em>Em Breve</em>' : ''}</button>`).join('');
    const topo = { geral: ['novoSetor', '+ Novo Setor'], colab: ['novaPessoa', '+ Novo Colaborador'], equipes: ['novaEquipe', '+ Nova Equipe'], criterios: ['novoCrit', '+ Novo Comportamento'], funcoes: ['novaFuncao', '+ Nova Função'], cargos: ['novoCargo', '+ Novo Cargo'], indicadores: ['novoInd', '+ Novo Indicador'] }[aba];
    $('acaoTopo').innerHTML = (aba === 'colab' ? '<button class="btn" data-topo="lote">📋 Cadastrar Vários</button> ' : '') + (topo ? `<button class="btn pri" data-topo="${topo[0]}">${topo[1]}</button>` : '');
    $('conteudo').innerHTML = aba === 'geral' ? telaGeral() : aba === 'colab' ? telaColab() : aba === 'equipes' ? telaEquipes() : aba === 'criterios' ? telaCriterios() : aba === 'funcoes' ? telaFuncoes() : aba === 'cargos' ? telaCargos() : aba === 'biblioteca' ? telaBiblioteca() : aba === 'cincom' ? tela5M() : aba === 'dados' ? telaDados() : aba === 'indicadores' ? telaIndicadores() : telaBreve();
  }
  $('abas').onclick = (e) => { const b = e.target.closest('[data-aba]'); if (!b) return; aba = b.dataset.aba; if (aba === 'cincom') C5 = null; try { localStorage.setItem('fp-cad-aba', aba); } catch {} desenhar(); };
  $('acaoTopo').onclick = (e) => { const t = e.target.closest('[data-topo]')?.dataset.topo; if (t === 'novoSetor') janelaSetor(null); if (t === 'novaPessoa') janelaPessoa(null); if (t === 'lote') janelaLote(); if (t === 'novaEquipe') janelaEquipe(null); if (t === 'novoCrit') janelaCriterio(null); if (t === 'novaFuncao') janelaFuncao(null); if (t === 'novoCargo') janelaCargo(null); if (t === 'novoInd') janelaIndicador(null); };

  function telaBreve() {
    const txt = { biblioteca: 'A Biblioteca de Atividades Já Funciona Dentro do Plano Anual (Campo "O Que Fazer?" da Nova Atividade). Aqui Vai Ganhar uma Lista Própria para Editar o 5M de Todas de Uma Vez.',
            dados: 'Importar a Planilha .xlsm e Exportar Cópia de Segurança Entram na Semana 5 do Roteiro.' }[aba];
    return `<div class="card empty" style="padding:40px">${txt}</div>`;
  }

  // ---------- ABA: INDICADORES (cadastro e quais aparecem em Indicadores do Mês) ----------
  let inds = null;
  const numIn = (v) => { v = String(v ?? '').trim(); if (!v) return null; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); const n = parseFloat(v); return isNaN(n) ? NaN : n; };
  const numOut = (v) => v == null ? '' : String(v).replace('.', ',');
  const fmtMeta = (d) => d.verde == null ? 'Sem Meta' : `${d.direcao === 'up' ? '▲ A Partir de' : '▼ Até'} ${numOut(+d.verde)}`;
  async function carregarInds() {
    const { data, error } = await supabase.from('indicadores').select('*').eq('fazenda_id', fazenda.id).order('ordem');
    if (error) { inds = 'erro'; return desenhar(); }
    inds = data || [];
    if (!inds.length) {   // primeira vez: os indicadores padrão do catálogo
      const { data: novos, error: e2 } = await supabase.from('indicadores').insert(INDICADORES_CATALOGO.filter(p => p.padrao).map((p, i) => ({ fazenda_id: fazenda.id, ordem: i, nome: p.nome, unidade: p.unidade, grupo: p.grupo, descricao: p.descricao, direcao: p.direcao, verde: p.verde, vermelho: p.vermelho, casas: p.casas, auto: p.auto, ativo: true }))).select();
      if (!e2) inds = (novos || []).sort((a, b) => a.ordem - b.ordem);
    }
    desenhar();
  }
  function telaIndicadores() {
    if (inds === null) { carregarInds(); return '<div class="card empty">Carregando os Indicadores…</div>'; }
    if (inds === 'erro') return '<div class="card empty" style="padding:40px">Falta Rodar os SQL 018 e 019 no Supabase.</div>';
    const grupos = [...new Set(inds.map(d => d.grupo || 'Outros'))];
    const noPainel = inds.filter(d => d.ativo).length, faltam = INDICADORES_CATALOGO.filter(c => !inds.some(d => semAcento(d.nome) === semAcento(c.nome))).length;
    return `<div class="card fs" style="margin-bottom:14px;background:var(--surface2)">
        <div class="sub" style="font-size:13px">📊 <b>${noPainel} de ${inds.length} Indicadores Aparecem em Indicadores do Mês.</b> Marque ou Desmarque a Coluna <b>Painel</b> para Escolher. Use ▲▼ para Mudar a Ordem e <b>Editar</b> para Meta, Como Calcular e Responsável.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-indcat="1">📚 Adicionar do Catálogo Gesta'Up (${faltam} Disponíveis)</button><a class="btn sm" href="indicadores.html" style="text-decoration:none">Abrir Indicadores do Mês ›</a></div></div>
      ${grupos.map(g => `<div class="card" style="margin-bottom:14px"><div class="cardh"><h3>${esc(tc(g))}</h3><small>${inds.filter(d => (d.grupo || 'Outros') === g && d.ativo).length} no Painel</small></div>
        <div class="scroll"><table class="tbl"><thead><tr><th style="width:60px;text-align:center">Painel</th><th>Indicador</th><th>Unidade</th><th>Meta</th><th>Responsável</th><th style="width:70px">Ordem</th><th></th></tr></thead><tbody>
        ${inds.filter(d => (d.grupo || 'Outros') === g).map(d => `<tr style="${d.ativo ? '' : 'opacity:.55'}">
          <td style="text-align:center"><input type="checkbox" data-indpainel="${d.id}" ${d.ativo ? 'checked' : ''} style="width:18px;height:18px"></td>
          <td><b>${esc(tc(d.nome))}</b>${d.auto ? ' <span class="pill p3" title="Calculado pelo Sistema">⚡ Automático</span>' : ''}<div class="sub" style="font-size:12px">${esc(d.descricao || '')}</div></td>
          <td class="sub">${esc(d.unidade || '—')}</td><td style="white-space:nowrap">${fmtMeta(d)}</td>
          <td>${esc(nomePessoa(d.responsavel_id) || '—')}</td>
          <td style="white-space:nowrap"><button class="btn sm ghost" data-indmove="${d.id}" data-dir="-1" title="Subir">▲</button><button class="btn sm ghost" data-indmove="${d.id}" data-dir="1" title="Descer">▼</button></td>
          <td style="text-align:right"><button class="btn sm" data-inded="${d.id}">Editar</button></td></tr>`).join('')}
        </tbody></table></div></div>`).join('')}`;
  }
  function janelaIndicador(d) {
    const novo = !d; d = d || { nome: '', unidade: '', grupo: '', direcao: 'up', verde: null, vermelho: null, casas: 2, descricao: '', responsavel_id: null, ativo: true };
    const gruposL = [...new Set([...INDICADORES_CATALOGO.map(c => c.grupo), ...(Array.isArray(inds) ? inds.map(x => x.grupo).filter(Boolean) : [])])].sort();
    $('modal').innerHTML = `<div class="scrim" data-x="1"></div><form class="fmodal" id="fInd">
      <div class="dh"><div><div class="eyebrow">Cadastros · Indicadores</div><h2>${novo ? 'Novo Indicador' : 'Editar Indicador'}</h2></div><button type="button" class="btn ghost" data-x="1">✕</button></div>
      <div class="fb">
        <div class="fr"><label class="fl">Indicador *<input class="in" id="iNome" required value="${esc(tc(d.nome))}" placeholder="Ex.: Taxa de Prenhez"></label>
          <label class="fl">Unidade<input class="in" id="iUn" value="${esc(d.unidade || '')}" placeholder="Ex.: %, kg/Cab/Dia, R$/@"></label>
          <label class="fl">Grupo<input class="in" id="iGr" list="lGr" value="${esc(d.grupo || '')}" placeholder="Ex.: Rebanho"><datalist id="lGr">${gruposL.map(g => `<option value="${esc(g)}">`).join('')}</datalist></label></div>
        <label class="fl">Como Calcular<textarea class="in" id="iDesc" rows="2" placeholder="Ex.: Vacas Prenhes ÷ Vacas Expostas × 100" ${d.auto ? 'disabled' : ''}>${esc(d.descricao || '')}</textarea></label>
        <div class="fr"><label class="fl">O Que É Melhor?<select class="in" id="iDir"><option value="up" ${d.direcao === 'up' ? 'selected' : ''}>▲ Maior É Melhor</option><option value="down" ${d.direcao === 'down' ? 'selected' : ''}>▼ Menor É Melhor</option></select></label>
          <label class="fl"><span id="lVerde">Verde</span><input class="in" id="iVerde" inputmode="decimal" value="${numOut(d.verde)}"></label>
          <label class="fl"><span id="lVerm">Vermelho</span><input class="in" id="iVerm" inputmode="decimal" value="${numOut(d.vermelho)}"></label>
          <label class="fl">Casas Decimais<input class="in" id="iCasas" type="number" min="0" max="4" value="${d.casas ?? 2}"></label></div>
        <div class="sub" id="iRegra" style="font-size:12.5px"></div>
        <div class="fr"><label class="fl">Responsável por Lançar<select class="in" id="iResp">${opcoesPessoas(d.responsavel_id)}</select></label></div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="iAtivo" ${d.ativo ? 'checked' : ''}> Mostrar em Indicadores do Mês</label>
        ${d.auto ? '<div class="sub">⚡ Este Indicador É Calculado pelo Sistema: Só a Meta e o Painel Podem Ser Mudados.</div>' : ''}</div>
      <div class="df">${!novo && !d.auto ? '<button type="button" class="btn" id="iApagar" style="color:var(--s4)">Apagar</button>' : ''}<div class="r"><button type="button" class="btn" data-x="1">Cancelar</button><button type="submit" class="btn dark">✓ Salvar</button></div></div></form>`;
    const regra = () => { const up = $('iDir').value === 'up';
      $('lVerde').textContent = up ? 'Verde a Partir de' : 'Verde Até'; $('lVerm').textContent = up ? 'Vermelho Abaixo de' : 'Vermelho a Partir de';
      $('iRegra').textContent = 'Entre os Dois Valores o Farol Fica Amarelo (Zona de Atenção).'; };
    regra(); $('iDir').onchange = regra;
    if ($('iApagar')) $('iApagar').onclick = async () => {
      if (!confirm('Apagar "' + tc(d.nome) + '" e Todos os Resultados Já Lançados Nele?\n(Para Só Esconder do Painel, Desmarque "Mostrar no Painel".)')) return;
      const { error } = await supabase.from('indicadores').delete().eq('id', d.id); if (error) return aviso('Erro: ' + error.message);
      inds = inds.filter(x => x.id !== d.id); fechar(); desenhar(); aviso('Indicador Apagado');
    };
    $('fInd').onsubmit = async (ev) => {
      ev.preventDefault();
      const verde = numIn($('iVerde').value), vermelho = numIn($('iVerm').value);
      if (Number.isNaN(verde) || Number.isNaN(vermelho)) return aviso('Meta Inválida: Use Só Números');
      const dados = { fazenda_id: fazenda.id, nome: tc($('iNome').value.trim()), unidade: $('iUn').value.trim() || null, grupo: tc($('iGr').value.trim()) || null,
        direcao: $('iDir').value, verde, vermelho, casas: +$('iCasas').value || 0, responsavel_id: $('iResp').value || null, ativo: $('iAtivo').checked };
      if (!d.auto) dados.descricao = $('iDesc').value.trim() || null;
      if (novo) dados.ordem = Array.isArray(inds) ? inds.length : 0;
      const r = novo ? await supabase.from('indicadores').insert(dados).select().single() : await supabase.from('indicadores').update(dados).eq('id', d.id).select().single();
      if (r.error) return aviso('Erro: ' + r.error.message);
      if (novo) inds.push(r.data); else Object.assign(d, r.data || dados);
      fechar(); desenhar(); aviso(novo ? 'Indicador Criado' : 'Indicador Salvo');
    };
  }
  function janelaCatalogo() {
    const disp = INDICADORES_CATALOGO.filter(c => !inds.some(d => semAcento(d.nome) === semAcento(c.nome)));
    const grupos = [...new Set(disp.map(c => c.grupo))];
    $('modal').innerHTML = `<div class="scrim" data-x="1"></div><form class="fmodal" id="fCat" style="width:min(760px,calc(100% - 24px))">
      <div class="dh"><div><div class="eyebrow">Cadastros · Indicadores</div><h2>Catálogo de Indicadores Gesta'Up</h2></div><button type="button" class="btn ghost" data-x="1">✕</button></div>
      <div class="fb">${disp.length ? grupos.map(g => `<div><b style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)">${esc(g)}</b>
          ${disp.filter(c => c.grupo === g).map(c => `<label style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2);cursor:pointer"><input type="checkbox" data-cat="${esc(c.nome)}" style="margin-top:3px">
            <span><b>${esc(c.nome)}</b> <span class="sub">· ${esc(c.unidade)} · ${c.direcao === 'up' ? '▲' : '▼'} Meta ${numOut(c.verde)}</span><br><small class="sub">${esc(c.descricao)}</small></span></label>`).join('')}</div>`).join('')
        : '<div class="empty">Todos os Indicadores do Catálogo Já Estão Nesta Fazenda.</div>'}</div>
      <div class="df"><div class="r"><button type="button" class="btn" data-x="1">Cancelar</button>${disp.length ? '<button type="submit" class="btn dark">+ Adicionar Marcados</button>' : ''}</div></div></form>`;
    $('fCat').onsubmit = async (ev) => {
      ev.preventDefault();
      const nomes = [...document.querySelectorAll('[data-cat]:checked')].map(x => x.dataset.cat); if (!nomes.length) return aviso('Marque Pelo Menos Um');
      const linhas = INDICADORES_CATALOGO.filter(c => nomes.includes(c.nome)).map((c, i) => ({ fazenda_id: fazenda.id, ordem: inds.length + i, nome: c.nome, unidade: c.unidade, grupo: c.grupo, descricao: c.descricao, direcao: c.direcao, verde: c.verde, vermelho: c.vermelho, casas: c.casas, auto: c.auto, ativo: true }));
      const { data, error } = await supabase.from('indicadores').insert(linhas).select(); if (error) return aviso('Erro: ' + error.message);
      inds.push(...(data || [])); fechar(); desenhar(); aviso(linhas.length + ' Indicadores Adicionados ao Painel');
    };
  }
  $('conteudo').addEventListener('click', async (e) => {
    if (aba !== 'indicadores' || !Array.isArray(inds)) return;
    if (e.target.closest('[data-indcat]')) return janelaCatalogo();
    const ed = e.target.closest('[data-inded]'); if (ed) return janelaIndicador(inds.find(d => d.id === ed.dataset.inded));
    const mv = e.target.closest('[data-indmove]');
    if (mv) {   // troca de lugar com o vizinho do mesmo grupo
      const d = inds.find(x => x.id === mv.dataset.indmove), mesmo = inds.filter(x => (x.grupo || 'Outros') === (d.grupo || 'Outros')), i = mesmo.indexOf(d), o = mesmo[i + +mv.dataset.dir];
      if (!o) return;
      const a = inds.indexOf(d), b = inds.indexOf(o); [inds[a], inds[b]] = [inds[b], inds[a]];
      inds.forEach((x, k) => x.ordem = k); desenhar();
      await Promise.all(inds.filter((x, k) => k >= Math.min(a, b) && k <= Math.max(a, b)).map(x => supabase.from('indicadores').update({ ordem: x.ordem }).eq('id', x.id)));
    }
  });
  $('conteudo').addEventListener('change', async (e) => {
    if (aba !== 'indicadores' || !e.target.dataset.indpainel) return;
    const d = inds.find(x => x.id === e.target.dataset.indpainel), ativo = e.target.checked;
    const { error } = await supabase.from('indicadores').update({ ativo }).eq('id', d.id);
    if (error) { e.target.checked = !ativo; return aviso('Erro: ' + error.message); }
    d.ativo = ativo; desenhar(); aviso(tc(d.nome) + (ativo ? ': Aparece no Painel' : ': Escondido do Painel'));
  });

  // Backup em Excel: uma aba por tabela do banco
  const TABELAS_BACKUP = [['fazendas','Fazenda','id'],['setores','Setores'],['pessoas','Pessoas'],['equipes','Equipes'],['atividades','Atividades'],['planejamento','Plano (Todos os Anos)'],

  const celula = (v) => v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : v);

  const ehConsultor = () => eu.papel === 'consultor';
  async function carregarBiblio() {

        ${L.map(b => { const ja = naFaz.has(semAcento(b.nome)), n5 = tem5M(b), sem = b.semanas || [];

          <button class="btn pri" data-badd="1" ${novas.length && podeCriar ? '' : 'disabled'}>+ Adicionar ${novas.length || ''} à Fazenda</button></span></div></div>`;
  }
  async function adicionarDaBiblio() {
    const naFaz = new Set(atividades.map(a => semAcento(a.nome)));
    const itens = biblio.filter(b => bSel.has(b.id) && !naFaz.has(semAcento(b.nome)));
    if (!itens.length) return;
    // Setores: usa o da fazenda com o mesmo nome; se não existir, cria
    for (const nomeS of [...new Set(itens.map(b => b.setor_nome).filter(Boolean))]) {
      if (setores.some(s => semAcento(s.nome) === semAcento(nomeS))) continue;
      const { data, error } = await supabase.from('setores').insert({ fazenda_id: fazenda.id, nome: tc(nomeS) }).select().single();
      if (error) return aviso(erroBonito(error.message)); setores.push(data);
    }
    const setorDe = (n) => setores.find(s => semAcento(s.nome) === semAcento(n))?.id || null;
    const linhas = itens.map(b => ({ fazenda_id: fazenda.id, nome: tc(b.nome), setor_id: setorDe(b.setor_nome), tipo: b.tipo, urgencia: b.urgencia || 2, dias: b.dias, local: b.local, como_fazer: b.como_fazer }));
    const { data: novas, error } = await supabase.from('atividades').insert(linhas).select('id, nome, setor_id, executor_pessoa_id, executor_equipe_id');
    if (error) return aviso(erroBonito(error.message));
    let nPl = 0;
    if (bSemanas) {
      const pl = [];
      novas.forEach(a => { const b = itens.find(x => semAcento(x.nome) === semAcento(a.nome)); (b?.semanas || []).filter(w => w >= SEMANA).forEach(w => pl.push({ fazenda_id: fazenda.id, atividade_id: a.id, ano: ANO, semana: w, status: 1 })); });
      for (let i = 0; i < pl.length; i += 500) { const { error: e2 } = await supabase.from('planejamento').insert(pl.slice(i, i + 500)); if (e2) return aviso('Atividades Criadas, mas Erro nas Semanas: ' + e2.message); }
      nPl = pl.length;
    }
    atividades.push(...novas); bSel.clear(); desenhar();
    aviso(`${novas.length} Atividades Adicionadas${nPl ? ' · ' + nPl + ' Semanas Planejadas' : ''}. Defina Quem Faz no Plano Anual.`);
  }
  async function enviarParaBiblio() {
    if (!confirm('Enviar as atividades desta fazenda para a Biblioteca? As que já existem lá (mesmo nome) não são alteradas.')) return;

      buscarTudo(() => supabase.from('atividades').select('id, nome, setor_id, tipo, urgencia, dias, local, como_fazer').eq('fazenda_id', fazenda.id)),

    const ja = new Set(biblio.map(b => semAcento(b.nome)));

    if (!novos.length) return aviso('Todas as Atividades Desta Fazenda Já Estão na Biblioteca');
    const { error } = await supabase.from('biblioteca').upsert(novos, { onConflict: 'conta_id,chave', ignoreDuplicates: true });

    return `<div class="kpis" style="margin-bottom:14px">
        <div class="card kpi"><small>Atividades</small><b class="num">${at.length}</b><span>Cadastradas na Fazenda</span></div>

      else if (k === 'meta_unid') novo[k] = String(v || '').trim() || null;
      else novo[k] = String(v || '').trim();
    });
    const { error } = await supabase.from('atividades').update({ como_fazer: novo }).eq('id', id);

  async function chamarFuncao(body) {

  // ---------- Contrato de Resultados ----------
  const ativosDe = (pid, tipo) => contrato.filter(c => c.pessoa_id === pid && c.tipo === tipo && c.ativo);
  function contratoResumo(pid) { const t = ativosDe(pid, 'tarefa').length, c = ativosDe(pid, 'comportamento').length; return `${t} ${t === 1 ? 'Tarefa' : 'Tarefas'} · ${c} Comport.`; }
  const nomeFuncao = (c) => tc(funcoes.find(f => f.id === c.funcao_id)?.nome || c.texto || '');
  const caixa = (lista, marcados, attr, rotulo) => lista.map(x => `<label data-nome="${esc(rotulo(x).toLowerCase())}"><input type="checkbox" ${attr}="${x.id}" ${marcados.includes(x.id) ? 'checked' : ''}> ${esc(rotulo(x))}${x.setor_id ? ` <span class="sub">· ${esc(nomeSetor(x.setor_id))}</span>` : ''}</label>`).join('');
  function blocoContrato(p) {
    const fMarc = ativosDe(p.id, 'tarefa').map(c => c.funcao_id).filter(Boolean);
    const fLista = funcoes.filter(f => f.ativo || fMarc.includes(f.id)).sort((x, y) => (fMarc.includes(y.id) - fMarc.includes(x.id)) || x.nome.localeCompare(y.nome, 'pt'));
    const marc = ativosDe(p.id, 'comportamento').map(c => c.criterio_id);
    const lista = criterios.filter(c => c.ativo || marc.includes(c.id)).sort((x, y) => (marc.includes(y.id) - marc.includes(x.id)) || x.nome.localeCompare(y.nome, 'pt'));
    const outros = pessoas.filter(x => x.id !== p.id && ativosDe(x.id, 'tarefa').length + ativosDe(x.id, 'comportamento').length);
    const ferramentas = (q, cargo, limpar) => `<div style="display:flex;gap:8px;flex-wrap:wrap"><input class="in" id="${q}" placeholder="Buscar…" style="flex:1;min-width:160px">
      <button type="button" class="btn sm" id="${cargo}">Marcar as do Mesmo Cargo</button><button type="button" class="btn sm ghost" id="${limpar}">Desmarcar Todas</button></div>`;
    return `<div class="card fs"><h4>📋 Contrato de Resultados</h4>
      <div class="sub" style="font-size:12.5px">O Que Esta Pessoa Precisa Entregar (Funções) e Como Precisa Agir (Comportamentos). É Isso Que Será Avaliado Toda Semana, Nota de 0 a 10.</div>

        <div style="display:flex;gap:8px"><input class="in" id="fNova" placeholder="Não Achou? Escreva uma Nova Função e Clique em Incluir"><button type="button" class="btn sm" id="fIncluir">+ Incluir</button></div>
        <div class="sub" style="font-weight:400">Ideal: 8 a 12 Funções. A Nova Função Fica no Cadastro para Usar com Outras Pessoas.</div></div>

      <div class="fl"><span>2. Comportamentos Desejáveis <span class="sub" style="font-weight:400" id="cCritN"></span></span>
        ${ferramentas('cBusca', 'cDoCargo', 'cLimpar')}
        <div class="ckl" id="cLista" style="max-height:260px">${caixa(lista, marc, 'data-crit', c => c.nome) || '<span class="sub">Cadastre na Aba Comportamentos.</span>'}</div>
        <div class="sub" style="font-weight:400">Ideal: até 10 Comportamentos, os Mais Importantes para a Função.</div></div></div>`;

  // Liga os botões do contrato depois que a janela abre
  function ligarContrato(pid) {
    if (!$('fLista')) return;
    const cargoDe = () => tc($('pCargo').value.trim()).toLowerCase();
    const mesmoCargo = () => pessoas.filter(x => x.id !== pid && cargoDe() && tc(x.cargo || '').toLowerCase() === cargoDe());
    const nMarc = (attr) => document.querySelectorAll(`[${attr}]:checked`).length;
    function atualizar() {
      const n = nMarc('data-fun'), m = nMarc('data-crit');
      $('cTarN').textContent = `· ${n} ${n === 1 ? 'Marcada' : 'Marcadas'}`; $('cCritN').textContent = `· ${m} ${m === 1 ? 'Marcado' : 'Marcados'}`;
    }
    const filtro = (busca, lista) => $(busca).addEventListener('input', () => { const q = $(busca).value.trim().toLowerCase(); document.querySelectorAll(`#${lista} label`).forEach(l => l.style.display = !q || l.dataset.nome.includes(q) ? '' : 'none'); });
    filtro('fBusca', 'fLista'); filtro('cBusca', 'cLista');
    $('fLista').addEventListener('change', atualizar); $('cLista').addEventListener('change', atualizar);
    const marcarCargo = (tipo, attr, campo) => {
      const ids = new Set(mesmoCargo().flatMap(x => ativosDe(x.id, tipo).map(c => c[campo])));
      if (!ids.size) return aviso('Ninguém com Esse Cargo Tem Isso Cadastrado');
      document.querySelectorAll(`[${attr}]`).forEach(c => { if (ids.has(c.getAttribute(attr))) c.checked = true; }); atualizar();
    };
    $('fDoCargo').onclick = () => marcarCargo('tarefa', 'data-fun', 'funcao_id');
    $('cDoCargo').onclick = () => marcarCargo('comportamento', 'data-crit', 'criterio_id');
    $('fLimpar').onclick = () => { document.querySelectorAll('[data-fun]').forEach(c => c.checked = false); atualizar(); };
    $('cLimpar').onclick = () => { document.querySelectorAll('[data-crit]').forEach(c => c.checked = false); atualizar(); };
    // Nova função: grava no cadastro e já marca
    const incluir = async () => {
      const nome = tc($('fNova').value.trim()); if (!nome) return;
      let f = funcoes.find(x => x.nome.toLowerCase() === nome.toLowerCase());
      if (!f) {
        const r = await supabase.from('funcoes').insert({ fazenda_id: fazenda.id, nome, setor_id: $('pSetor').value || null }).select().single();
        if (r.error) return aviso(erroBonito(r.error.message));
        f = r.data; funcoes.push(f);
        $('fLista').insertAdjacentHTML('afterbegin', caixa([f], [], 'data-fun', x => tc(x.nome)));
      }
      const cb = document.querySelector(`[data-fun="${f.id}"]`); cb.checked = true; cb.closest('label').style.display = '';
      $('fNova').value = ''; atualizar(); aviso('Função Incluída');
    };
    $('fIncluir').onclick = incluir;
    $('fNova').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); incluir(); } });
    $('cCopiar').onchange = (e) => {
      const de = e.target.value; if (!de) return;
      if (nMarc('data-fun') && !confirm('Trocar as Funções e Comportamentos Atuais pelos de ' + nomePessoa(de) + '?')) { e.target.value = ''; return; }
      const fs = ativosDe(de, 'tarefa').map(c => c.funcao_id), cs = ativosDe(de, 'comportamento').map(c => c.criterio_id);
      document.querySelectorAll('[data-fun]').forEach(c => c.checked = fs.includes(c.dataset.fun));
      document.querySelectorAll('[data-crit]').forEach(c => c.checked = cs.includes(c.dataset.crit));
      e.target.value = ''; atualizar(); aviso('Contrato Copiado · Ajuste e Salve');
    };
    atualizar();
  }
  async function salvarContrato(pid) {
    if (!$('fLista')) return;
    const fz = fazenda.id, meus = contrato.filter(c => c.pessoa_id === pid);
    // Funções e comportamentos: os marcados ficam ativos; os desmarcados ficam inativos (as notas antigas são guardadas)
    const grupos = [['tarefa', 'data-fun', 'funcao_id'], ['comportamento', 'data-crit', 'criterio_id']];
    for (const [tipo, attr, campo] of grupos) {
      const quer = [...document.querySelectorAll(`[${attr}]`)].filter(x => x.checked).map(x => x.getAttribute(attr));
      for (const [o, id] of quer.entries()) {
        const ex = meus.find(c => c.tipo === tipo && c[campo] === id);
        const extra = tipo === 'tarefa' ? { texto: funcoes.find(f => f.id === id)?.nome } : {};
        if (ex) { if (!ex.ativo || ex.ordem !== o) await supabase.from('contrato_itens').update({ ativo: true, ordem: o, ...extra }).eq('id', ex.id); }
        else await supabase.from('contrato_itens').insert({ fazenda_id: fz, pessoa_id: pid, tipo, [campo]: id, ordem: o, ...extra });
      }
      const sair = meus.filter(c => c.tipo === tipo && c.ativo && !quer.includes(c[campo])).map(c => c.id);
      if (sair.length) await supabase.from('contrato_itens').update({ ativo: false }).in('id', sair);
    }
  }

  // Lista de colaboradores para marcar quem tem esta função/comportamento no contrato
  function blocoQuemTem(tipo, campo, id) {
    const tem = id ? contrato.filter(c => c.tipo === tipo && c[campo] === id && c.ativo).map(c => c.pessoa_id) : [];
    const lista = pessoas.filter(p => p.ativo || tem.includes(p.id)).sort((a, b) => (tem.includes(b.id) - tem.includes(a.id)) || a.apelido.localeCompare(b.apelido, 'pt'));
    return `<div class="fl"><span>Quem Tem no Contrato de Resultados <span class="sub" style="font-weight:400" id="qtN">· ${tem.length} Marcados</span></span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="sub">Marcar Equipe Inteira:</span>${equipes.map(q => `<button type="button" class="btn sm" data-qteq="${q.id}">${esc(tc(q.nome))}</button>`).join('')}<button type="button" class="btn sm ghost" id="qtLimpar">Desmarcar Todos</button></div>

      <div class="sub" style="font-weight:400">Marcou, Já Entra no Contrato da Pessoa e Passa a Ser Avaliado na Avaliação de Desempenho.</div></div>`;

  function ligarQuemTem() {
    if (!$('qtLista')) return;
    $('qtBusca').addEventListener('input', () => { const q = $('qtBusca').value.trim().toLowerCase(); document.querySelectorAll('#qtLista label').forEach(l => l.style.display = !q || l.dataset.nome.includes(q) ? '' : 'none'); });
    const conta = () => $('qtN').textContent = `· ${document.querySelectorAll('[data-qt]:checked').length} Marcados`;
    $('qtLista').addEventListener('change', conta);
    document.querySelectorAll('[data-qteq]').forEach(b => b.onclick = () => {
      const ms = membros.filter(m => m.equipe_id === b.dataset.qteq).map(m => m.pessoa_id);
      if (!ms.length) return aviso('Essa Equipe Não Tem Membros');
      const caixas = [...document.querySelectorAll('[data-qt]')].filter(c => ms.includes(c.dataset.qt));
      if (!caixas.length) return aviso('Essa Equipe Não Tem Membros Ativos');
      const todas = caixas.every(c => c.checked);   // clicar de novo desmarca a equipe
      caixas.forEach(c => c.checked = !todas); conta();
      aviso((todas ? 'Desmarcada: ' : 'Marcada: ') + tc(equipes.find(q => q.id === b.dataset.qteq).nome) + ' (' + caixas.length + ')');
    });
    $('qtLimpar').onclick = () => { document.querySelectorAll('[data-qt]').forEach(c => c.checked = false); conta(); };
  }
  async function salvarQuemTem(tipo, campo, id, texto) {
    const quer = [...document.querySelectorAll('[data-qt]')].filter(c => c.checked).map(c => c.dataset.qt);
    const itens = contrato.filter(c => c.tipo === tipo && c[campo] === id);
    for (const pid of quer) {
      const ex = itens.find(c => c.pessoa_id === pid);
      if (ex) { if (!ex.ativo) await supabase.from('contrato_itens').update({ ativo: true }).eq('id', ex.id); }
      else {
        const ordem = contrato.filter(c => c.pessoa_id === pid && c.tipo === tipo && c.ativo).length;
        await supabase.from('contrato_itens').insert({ fazenda_id: fazenda.id, pessoa_id: pid, tipo, [campo]: id, ordem, ...(texto ? { texto } : {}) });
      }
    }
    const sair = itens.filter(c => c.ativo && !quer.includes(c.pessoa_id)).map(c => c.id);
    if (sair.length) await supabase.from('contrato_itens').update({ ativo: false }).in('id', sair);
  }

  // ---------- ABA: CARGOS (descrição do cargo, vai para o Contrato de Resultados) ----------
  const CAMPOS_CARGO = [['superior','Cargo Superior Imediato',0],['funcao_principal','Função Principal',1],['missao','Missão do Cargo',1],['atitudes','Atitudes Desejáveis',1],['experiencia','Experiência Desejável',1],['conhecimentos_desej','Conhecimentos Desejáveis',1],['conhecimentos_obrig','Conhecimentos Obrigatórios',1],['formacao','Formação Escolar Mínima',1],['disponibilidades','Disponibilidades Exigidas',1],['epis','EPIs Necessários',1]];
  function telaCargos() {

      ${cargos.map(c => `<tr><td><b>${esc(tc(c.nome))}</b></td><td class="sub">${esc(tc(c.superior || '—'))}</td><td class="sub">${esc(quem(c).join(', ') || '—')}</td>

      ${cargos.length ? '' : '<div class="empty">Nenhum Cargo. Rode o Arquivo 009 no Supabase ou Clique em + Novo Cargo.</div>'}</div>`;
  }
  $('conteudo').addEventListener('click', (e) => { const b = e.target.closest('[data-cargo-ed]'); if (b) janelaCargo(cargos.find(c => c.id === b.dataset.cargoEd)); });
  function janelaCargo(c) {

      <div class="dh"><div><div class="eyebrow">Cadastros · Cargos</div><h2>${novo ? 'Novo Cargo' : 'Editar Cargo'}</h2></div><button type="button" class="btn ghost" data-x="1">✕</button></div>

        ${CAMPOS_CARGO.map(([k, rot, grande]) => `<label class="fl">${rot}${grande ? `<textarea class="in" data-cg="${k}" rows="3">${esc(c[k] || '')}</textarea>` : `<input class="in" data-cg="${k}" value="${esc(c[k] || '')}">`}</label>`).join('')}</div>
      <div class="df">${novo ? '' : '<button type="button" class="btn danger" id="cgApagar">Excluir</button>'}<div class="r"><button type="button" class="btn" data-x="1">Cancelar</button><button type="submit" class="btn dark">✓ Salvar</button></div></div></form>`;
    $('fCargo').onsubmit = async (ev) => {
      ev.preventDefault();
      const dados = { fazenda_id: fazenda.id, nome: tc($('gNomeC').value.trim()) };
      document.querySelectorAll('[data-cg]').forEach(x => dados[x.dataset.cg] = x.value.trim() || null);

  }

  // ---------- ABA: FUNÇÕES (cadastro de atribuições) ----------
  function telaFuncoes() {
    const usam = (fid) => new Set(contrato.filter(c => c.funcao_id === fid && c.ativo).map(c => c.pessoa_id));
    return `<div class="card"><div class="cardh"><h3>Funções e Tarefas (Atribuições)</h3><small>${funcoes.filter(f => f.ativo).length} Ativas · Marcadas no Contrato de Cada Colaborador</small></div>

      </tbody></table></div>${funcoes.length ? '' : '<div class="empty">Nenhuma Função. Rode o Arquivo 008 no Supabase ou Clique em + Nova Função.</div>'}</div>`;
  }
  $('conteudo').addEventListener('input', (e) => { if (e.target.id !== 'fnBusca') return; const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('#fnCorpo tr').forEach(r => r.style.display = !q || r.dataset.busca.includes(q) ? '' : 'none'); });

  function janelaFuncao(f) {

  // ---------- ABA 4: CRITÉRIOS DE COMPORTAMENTO ----------
  function telaCriterios() {
    const usam = (cid) => new Set(contrato.filter(c => c.criterio_id === cid && c.ativo).map(c => c.pessoa_id)).size;
    return `<div class="card"><div class="cardh"><h3>Comportamentos</h3><small>${criterios.filter(c => c.ativo).length} Ativos · Escolhidos no Contrato de Cada Colaborador</small></div>

        <td style="text-align:right"><button class="btn sm" data-crit-ed="${c.id}">Editar</button></td></tr>`).join('')}
      </tbody></table></div>${criterios.length ? '' : '<div class="empty">Nenhum Comportamento. Rode o Arquivo 007 no Supabase ou Clique em + Novo Comportamento.</div>'}</div>`;

  // Janela: novo colaborador / editar
  function janelaPessoa(p) {
    const novo = !p; p = p || { apelido: '', nome: '', cargo: '', setor_id: '', superior_id: '', ativo: true };
    const minhasEq = membros.filter(m => m.pessoa_id === p.id).map(m => m.equipe_id);
    $('modal').innerHTML = `<div class="scrim" data-x="1"></div><form class="fmodal" id="fPes">
      <div class="dh"><div><div class="eyebrow">Equipe · Cadastro</div><h2>${novo ? 'Novo Colaborador' : 'Editar ' + esc(tc(p.apelido))}</h2></div><button type="button" class="btn ghost" data-x="1">✕</button></div>
      <div class="fb"><div class="fr">
        <label class="fl">Como é Chamado (Aparece no App)<input class="in" id="pApe" required value="${esc(tc(p.apelido))}" placeholder="Ex.: Zé Carlos"></label>
        <label class="fl">Nome Completo<input class="in" id="pNome" value="${esc(tc(p.nome || ''))}" placeholder="Nome e Sobrenome"></label>
        <label class="fl">Cargo / Função<input class="in" id="pCargo" value="${esc(tc(p.cargo || ''))}" placeholder="Ex.: Vaqueiro"></label></div>
        <div class="fr"><label class="fl">Setor<select class="in" id="pSetor"><option value="">—</option>${setores.map(s => `<option value="${s.id}" ${s.id === p.setor_id ? 'selected' : ''}>${esc(tc(s.nome))}</option>`).join('')}</select></label>
        <label class="fl">Responde a<select class="in" id="pSup">${opcoesPessoas(p.superior_id, '— Ninguém —')}</select></label></div>
        <div class="fl">Equipes do App<div class="ckl">${equipes.map(q => `<label><input type="checkbox" data-eq="${q.id}" ${minhasEq.includes(q.id) ? 'checked' : ''}> ${esc(tc(q.nome))}</label>`).join('') || '<span class="sub">Nenhuma Equipe Cadastrada.</span>'}</div></div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="pAtivo" ${p.ativo ? 'checked' : ''}> Ativo (Trabalha na Fazenda)</label>
        <div class="card fs"><h4>💰 Remuneração <span class="sub" style="font-weight:400">(Só Gestor, Administrativo e Consultor Veem)</span></h4><div class="fr">
          <label class="fl">Salário Base (R$)<input class="in" id="rSal" inputmode="decimal" value="${remun[p.id]?.salario_base ?? ''}" placeholder="Ex.: 3000"></label>
          <label class="fl">Bonificação por Trimestre (% do Salário)<input class="in" id="rPct" inputmode="decimal" value="${remun[p.id]?.bonus_pct ?? 50}"></label>
          <label class="fl">Vínculo<input class="in" id="rVin" value="${esc(remun[p.id]?.vinculo || '')}" placeholder="Ex.: Carteira Assinada"></label></div>
          <div class="sub">No Contrato: Bonificação do Trimestre = Salário × % × Nota do Trimestre ÷ 10.</div></div>
        ${blocoContrato(p)}
        ${blocoAcesso(p)}
</div>
      <div class="df"><div class="r"><button type="button" class="btn" data-x="1">Cancelar</button><button type="submit" class="btn dark">✓ Salvar</button></div></div></form>`;
    ligarContrato(p.id);
    const xc = $('xCriar'); if (xc) xc.onchange = () => { $('xCampos').style.display = xc.checked ? '' : 'none';
      if (xc.checked && !$('xUsu').value) $('xUsu').value = semAcento($('pApe').value) + '.' + semAcento(tc(fazenda.nome).replace(/^Fazenda /, '')); };
    const xg = $('xGerar'); if (xg) xg.onclick = () => { ($('xSenha') || $('xNova')).value = senhaNova(); };
    $('fPes').onsubmit = async (ev) => {
      ev.preventDefault();
      const dados = { fazenda_id: fazenda.id, apelido: tc($('pApe').value.trim()), nome: tc($('pNome').value.trim()) || null, cargo: tc($('pCargo').value.trim()) || null,
        setor_id: $('pSetor').value || null, superior_id: $('pSup').value || null, ativo: $('pAtivo').checked };
      const r = novo ? await supabase.from('pessoas').insert(dados).select().single() : await supabase.from('pessoas').update(dados).eq('id', p.id).select().single();
      if (r.error) return aviso(erroBonito(r.error.message));
      const id = r.data.id, quer = [...document.querySelectorAll('[data-eq]')].filter(c => c.checked).map(c => c.dataset.eq);
      const tirar = minhasEq.filter(q => !quer.includes(q)), por = quer.filter(q => !minhasEq.includes(q));
      if (por.length) await supabase.from('equipe_membros').insert(por.map(q => ({ equipe_id: q, pessoa_id: id })));
      for (const q of tirar) await supabase.from('equipe_membros').delete().eq('equipe_id', q).eq('pessoa_id', id);
      const pes = { ...dados, ...r.data };
      await salvarContrato(id);
      if ($('rSal')) {
        const num = (v) => { const x = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isNaN(x) ? null : x; };
        await supabase.from('remuneracao').upsert({ pessoa_id: id, fazenda_id: fazenda.id, salario_base: num($('rSal').value), bonus_pct: num($('rPct').value) ?? 50, vinculo: $('rVin').value.trim() || null }, { onConflict: 'pessoa_id' });
      }
      // Acesso: trocar perfil
      if ($('xPerfil') && p.user_id && $('xPerfil').value !== acessos[p.user_id]) {
        const { error } = await supabase.from('acessos').update({ papel: $('xPerfil').value }).eq('user_id', p.user_id).eq('fazenda_id', fazenda.id);
        if (error) aviso(erroBonito(error.message));
      }
      // Acesso: criar login
      if ($('xCriar')?.checked) {
        const usuario = $('xUsu').value.trim().toLowerCase(), senha = $('xSenha').value.trim();
        const erro = await chamarFuncao({ acao: 'criar', fazenda_id: fazenda.id, pessoa_id: id, usuario, senha, papel: $('xPapel').value });
        if (erro) { aviso('Colaborador Salvo, mas o Login Não: ' + erro); fechar(); return carregar(); }
        mostrarRecado(pes, usuario, senha, 'criar'); return carregar();
      }
      // Acesso: nova senha
      const nova = $('xNova')?.value.trim();
      if (nova) {
        const erro = await chamarFuncao({ acao: 'senha', fazenda_id: fazenda.id, pessoa_id: id, senha: nova });
        if (erro) { aviso('Colaborador Salvo, mas a Senha Não: ' + erro); fechar(); return carregar(); }
        mostrarRecado(pes, p.usuario, nova, 'senha'); return carregar();
      }
      fechar(); aviso(novo ? 'Colaborador Cadastrado' : 'Colaborador Salvo'); carregar();
    };
  }

    $('modal').innerHTML = `<div class="scrim" data-x="1"></div><form class="fmodal" id="fAces">
      <div class="dh"><h2>${acao === 'criar' ? 'Criar Acesso' : 'Trocar Senha'} · ${esc(tc(p.apelido))}</h2><button type="button" class="btn ghost" data-x="1">✕</button></div>
      <div class="fb">
        ${acao === 'criar' ? `<label class="fl">Usuário (é o que a pessoa digita para entrar)<input class="in" id="aUsu" value="${sugestao}" autocomplete="off"></label>` : `<div class="sub">Usuário: <b>${esc(p.usuario)}</b></div>`}

  function mostrarRecado(p, usuario, senha, acao) {

  // ---------- CADASTRAR VÁRIOS COLABORADORES DE UMA VEZ ----------
  // Cola a lista do Excel (ou abre a planilha-modelo preenchida), confere e cadastra tudo:
  // setores e equipes que faltarem, membros, líderes e, se quiser, o login de cada um.
  const COLS_LOTE = [['apelido', 'Como é Chamado'], ['nome', 'Nome Completo'], ['cargo', 'Cargo / Função'], ['setor', 'Setor'], ['equipe', 'Equipe'], ['lider', 'Líder da Equipe? (Sim)']];
  let LOTE = { texto: '', login: true };
  const ehSim = (v) => /^(s|sim|x|1|l[ií]der|yes)$/i.test(String(v || '').trim());
  const chave = (s) => semAcento(tc(String(s || '').trim()));
  function lerLote(texto) {
    const linhas = String(texto || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
    if (!linhas.length) return [];
    const sep = linhas.some(l => l.includes('\t')) ? '\t' : linhas.some(l => l.includes(';')) ? ';' : ',';
    let cab = linhas[0].split(sep).map(c => c.trim().toLowerCase());
    let ordem = COLS_LOTE.map(c => c[0]);
    const temCab = cab.some(c => /chamad|apelido|nome/.test(c));
    if (temCab) {
      ordem = cab.map(c => /chamad|apelido/.test(c) ? 'apelido' : /completo|^nome/.test(c) ? 'nome' : /cargo|fun/.test(c) ? 'cargo' : /setor/.test(c) ? 'setor'
        : /l[ií]der/.test(c) ? 'lider' : /equipe/.test(c) ? 'equipe' : null);
      linhas.shift();
    }
    const vistos = {};
    const existentes = new Set(pessoas.map(p => chave(p.apelido)));
    return linhas.map((l, i) => {
      const cel = l.split(sep), r = { n: i + 1 };
      ordem.forEach((k, j) => { if (k) r[k] = String(cel[j] ?? '').trim(); });
      r.apelido = tc(r.apelido || ''); r.nome = tc(r.nome || ''); r.cargo = tc(r.cargo || ''); r.setor = tc(r.setor || '');
      r.equipes = String(r.equipe || '').split(sep === ',' ? /[\/+]/ : /[\/+,]/).map(x => tc(x.trim())).filter(Boolean);
      r.lider = ehSim(r.lider);
      const k = chave(r.apelido);
      r.situ = !r.apelido ? 'vazio' : existentes.has(k) ? 'existe' : vistos[k] ? 'repetido' : 'novo';
      if (r.apelido) vistos[k] = 1;
      return r;
    }).filter(r => r.apelido || r.nome);
  }
  function janelaLote() {
    const L = lerLote(LOTE.texto), novos = L.filter(r => r.situ === 'novo');
    const setNovos = [...new Set(novos.map(r => r.setor).filter(s => s && !setores.some(x => chave(x.nome) === chave(s))))];
    const eqNovas = [...new Set(novos.flatMap(r => r.equipes).filter(q => !equipes.some(x => chave(x.nome) === chave(q))))];
    const lideres = {}; novos.filter(r => r.lider).forEach(r => r.equipes.forEach(q => (lideres[chave(q)] ||= []).push(r.apelido)));
    const doisLideres = Object.entries(lideres).filter(([, v]) => v.length > 1);
    const SIT = { novo: ['p3', 'Novo'], existe: ['p4', 'Já Cadastrado · Pula'], repetido: ['p4', 'Repetido na Lista · Pula'], vazio: ['p4', 'Sem "Como é Chamado" · Pula'] };
    $('modal').innerHTML = `<div class="scrim" data-x="1"></div><div class="fmodal" style="width:min(900px,calc(100% - 24px))">
      <div class="dh"><div><div class="eyebrow">Equipe · Cadastro em Lote</div><h2>📋 Cadastrar Vários Colaboradores</h2></div><button type="button" class="btn ghost" data-x="1">✕</button></div>
      <div class="fb">
        <div class="sub" style="font-size:13.5px">Copie as linhas do Excel e cole abaixo, <b>ou</b> baixe o modelo, preencha e abra aqui. Colunas, nesta ordem: <b>${COLS_LOTE.map(c => c[1]).join(' · ')}</b>. Mais de uma equipe: separe com "/".</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn sm" id="lModelo">📥 Baixar Modelo em Excel</button>
          <label class="btn sm" style="cursor:pointer">📂 Abrir Planilha Preenchida<input type="file" id="lArq" accept=".xlsx,.xls,.csv" style="display:none"></label>
          ${LOTE.texto ? '<button type="button" class="btn sm ghost" id="lLimpar">Limpar</button>' : ''}</div>
        <textarea class="in" id="lTexto" rows="${L.length ? 4 : 8}" placeholder="Zé Carlos&#9;José Carlos da Silva&#9;Vaqueiro&#9;Gado&#9;Equipe Gado&#9;Sim&#10;Tião&#9;Sebastião Souza&#9;Tratorista&#9;Máquinas&#9;Equipe Máquinas" style="font-family:monospace;font-size:12.5px;white-space:pre">${esc(LOTE.texto)}</textarea>
        ${L.length ? `<div class="scroll" style="max-height:300px"><table class="tbl"><thead><tr><th>#</th><th>Como é Chamado</th><th>Nome Completo</th><th>Cargo</th><th>Setor</th><th>Equipe</th><th>Líder</th><th>Situação</th></tr></thead><tbody>
          ${L.map(r => `<tr style="${r.situ === 'novo' ? '' : 'opacity:.55'}"><td class="sub">${r.n}</td><td><b>${esc(r.apelido) || '—'}</b></td><td>${esc(r.nome)}</td><td>${esc(r.cargo)}</td>
            <td>${esc(r.setor)}${r.setor && setNovos.includes(r.setor) ? ' <span class="sub">(Novo)</span>' : ''}</td>
            <td>${r.equipes.map(q => esc(q) + (eqNovas.includes(q) ? ' <span class="sub">(Nova)</span>' : '')).join('<br>')}</td>
            <td>${r.lider ? '⭐ Sim' : ''}</td><td><span class="pill ${SIT[r.situ][0]}">${SIT[r.situ][1]}</span></td></tr>`).join('')}</tbody></table></div>
          <div class="sub">${novos.length} ${novos.length === 1 ? 'Pessoa Nova' : 'Pessoas Novas'}${setNovos.length ? ` · ${setNovos.length} ${setNovos.length === 1 ? 'Setor Novo' : 'Setores Novos'}` : ''}${eqNovas.length ? ` · ${eqNovas.length} ${eqNovas.length === 1 ? 'Equipe Nova' : 'Equipes Novas'}` : ''}${L.length - novos.length ? ` · ${L.length - novos.length} ${L.length - novos.length === 1 ? 'Linha Pulada' : 'Linhas Puladas'}` : ''}</div>
          ${doisLideres.length ? `<div class="warn"><span>⚠</span><div>Mais de um líder na mesma equipe: ${doisLideres.map(([, v]) => v.join(' e ')).join('; ')}. Fica como líder o último da lista. Ajuste depois em Equipes do App.</div></div>` : ''}
          ${podeCriar && novos.length ? `<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="lLogin" ${LOTE.login ? 'checked' : ''}> Criar o Login de Cada Um (Usuário e Senha Gerados; Líder Já Entra com Perfil de Líder)</label>` : ''}` : ''}
      </div>
      <div class="df"><div class="r"><button type="button" class="btn" data-x="1">Cancelar</button><button type="button" class="btn dark" id="lIr" ${novos.length ? '' : 'disabled'}>✓ Cadastrar ${novos.length || ''} ${novos.length === 1 ? 'Colaborador' : 'Colaboradores'}</button></div></div></div>`;
    const tx = $('lTexto'); let tm;
    tx.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { LOTE.texto = tx.value; const pos = tx.selectionStart; janelaLote(); const t2 = $('lTexto'); t2.focus(); t2.setSelectionRange(pos, pos); }, 500); };
    tx.onpaste = () => setTimeout(() => { LOTE.texto = tx.value; janelaLote(); }, 30);
    if ($('lLimpar')) $('lLimpar').onclick = () => { LOTE.texto = ''; janelaLote(); };
    if ($('lLogin')) $('lLogin').onchange = (e) => { LOTE.login = e.target.checked; };
    $('lModelo').onclick = async () => {
      const { carregarExcel } = await import('./excel.js'); await carregarExcel(); const X = window.XLSX;
      const ws = X.utils.aoa_to_sheet([COLS_LOTE.map(c => c[1]), ['Zé Carlos', 'José Carlos da Silva', 'Vaqueiro', 'Gado', 'Equipe Gado', 'Sim'], ['Tião', 'Sebastião Souza', 'Tratorista', 'Máquinas', 'Equipe Máquinas', '']]);
      ws['!cols'] = [18, 30, 18, 14, 24, 20].map(w => ({ wch: w }));
      const ajuda = X.utils.aoa_to_sheet([['Como Preencher'], ['Uma pessoa por linha. Apague as 2 linhas de exemplo.'], ['Como é Chamado: o nome que aparece no app (obrigatório).'], ['Equipe: mais de uma, separe com "/" (ex.: Equipe Gado / Equipe Cerca).'], ['Líder da Equipe: escreva Sim para quem dá a baixa pela equipe.'], ['Setor e Equipe que ainda não existem são criados sozinhos.'], ['Depois: Cadastros › Colaboradores › 📋 Cadastrar Vários › 📂 Abrir Planilha Preenchida.']]);
      ajuda['!cols'] = [{ wch: 80 }];
      const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Colaboradores'); X.utils.book_append_sheet(wb, ajuda, 'Como Preencher');
      X.writeFile(wb, 'Modelo - Cadastro de Colaboradores - ' + tc(fazenda.nome) + '.xlsx');
    };
    $('lArq').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const { carregarExcel } = await import('./excel.js'); await carregarExcel(); const X = window.XLSX;
        const wb = X.read(await f.arrayBuffer(), { type: 'array' });
        LOTE.texto = X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: '\t', blankrows: false }).split('\n').filter(l => l.replace(/\t/g, '').trim()).join('\n');
        janelaLote();
      } catch (err) { aviso('Não Consegui Ler a Planilha: ' + err.message, 4000); }
    };
    if ($('lIr')) $('lIr').onclick = () => gravarLote(novos, setNovos, eqNovas);
  }
  async function gravarLote(novos, setNovos, eqNovas) {
    const bt = $('lIr'), passo = (t) => { bt.textContent = t; };
    bt.disabled = true; const login = podeCriar && !!$('lLogin')?.checked;
    const erros = [];
    // 1. Setores e equipes que faltam
    const mapaSet = Object.fromEntries(setores.map(s => [chave(s.nome), s.id]));
    for (const s of setNovos) { passo('Criando Setor ' + s + '…'); const r = await supabase.from('setores').insert({ fazenda_id: fazenda.id, nome: s }).select().single(); if (r.error) erros.push('Setor ' + s + ': ' + r.error.message); else mapaSet[chave(s)] = r.data.id; }
    const mapaEq = Object.fromEntries(equipes.map(q => [chave(q.nome), q.id]));
    for (const q of eqNovas) { passo('Criando ' + q + '…'); const r = await supabase.from('equipes').insert({ fazenda_id: fazenda.id, nome: q }).select().single(); if (r.error) erros.push('Equipe ' + q + ': ' + r.error.message); else mapaEq[chave(q)] = r.data.id; }
    // 2. Pessoas, membros e líderes
    const slug = semAcento(tc(fazenda.nome).replace(/^Fazenda /, '')), usados = new Set(pessoas.map(p => p.usuario).filter(Boolean));
    const feitos = [];
    for (const [i, r] of novos.entries()) {
      passo(`Cadastrando ${i + 1} de ${novos.length}: ${r.apelido}…`);
      const ins = await supabase.from('pessoas').insert({ fazenda_id: fazenda.id, apelido: r.apelido, nome: r.nome || null, cargo: r.cargo || null, setor_id: mapaSet[chave(r.setor)] || null, ativo: true }).select().single();
      if (ins.error) { feitos.push({ ...r, erro: erroBonito(ins.error.message) }); continue; }
      const id = ins.data.id, eqs = r.equipes.map(q => mapaEq[chave(q)]).filter(Boolean);
      if (eqs.length) { const m = await supabase.from('equipe_membros').insert(eqs.map(q => ({ equipe_id: q, pessoa_id: id }))); if (m.error) erros.push(r.apelido + ' na equipe: ' + m.error.message); }
      if (r.lider) for (const q of eqs) { const u = await supabase.from('equipes').update({ lider_id: id }).eq('id', q); if (u.error) erros.push(r.apelido + ' como líder: ' + u.error.message); }
      const f = { ...r, id };
      if (login) {
        let usuario = semAcento(r.apelido) + '.' + slug, k = 2; while (usados.has(usuario)) usuario = semAcento(r.apelido) + k++ + '.' + slug; usados.add(usuario);
        const senha = senhaNova();
        passo(`Criando Login ${i + 1} de ${novos.length}: ${r.apelido}…`);
        const erro = await chamarFuncao({ acao: 'criar', fazenda_id: fazenda.id, pessoa_id: id, usuario, senha, papel: r.lider ? 'lider' : 'colaborador' });
        if (erro) f.erro = 'Cadastrado, mas o Login Não: ' + erro; else { f.usuario = usuario; f.senha = senha; }
      }
      feitos.push(f);
    }
    LOTE.texto = '';
    resultadoLote(feitos, erros, login);
    carregar();
  }
  function resultadoLote(feitos, erros, login) {
    const ok = feitos.filter(f => !f.erro || f.usuario).length, comLogin = feitos.filter(f => f.usuario);
    const recado = (f) => `Olá, ${f.apelido}! Seu acesso ao Farm Plan está pronto.\nSite: ${SITE}\nUsuário: ${f.usuario}\nSenha: ${f.senha}`;
    $('modal').innerHTML = `<div class="scrim"></div><div class="fmodal" style="width:min(820px,calc(100% - 24px))">
      <div class="dh"><h2>✓ ${ok} ${ok === 1 ? 'Colaborador Cadastrado' : 'Colaboradores Cadastrados'}</h2><button type="button" class="btn ghost" data-x="1">✕</button></div>
      <div class="fb">
        ${comLogin.length ? `<div class="warn"><span>⚠</span><div><b>Baixe o Excel ou imprima as folhas agora.</b> Por segurança, as senhas não ficam visíveis depois. Se perder, use Trocar Senha.</div></div>` : ''}
        <div class="scroll" style="max-height:340px"><table class="tbl" id="lRes"><thead><tr><th>Como é Chamado</th><th>Equipe</th>${login ? '<th>Usuário</th><th>Senha</th><th></th>' : ''}<th>Situação</th></tr></thead><tbody>
        ${feitos.map(f => `<tr><td><b>${esc(f.apelido)}</b>${f.lider ? ' ⭐' : ''}</td><td>${esc(f.equipes.join(' / '))}</td>
          ${login ? `<td>${esc(f.usuario || '—')}</td><td style="font-family:monospace;font-size:15px">${esc(f.senha || '—')}</td><td>${f.usuario ? `<a class="btn sm" style="text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(recado(f))}">WhatsApp</a>` : ''}</td>` : ''}
          <td>${f.erro ? `<span class="pill p4">${esc(f.erro)}</span>` : '<span class="pill p3">OK</span>'}</td></tr>`).join('')}</tbody></table></div>
        ${erros.length ? `<div class="warn"><span>⚠</span><div>${erros.map(esc).join('<br>')}</div></div>` : ''}
        <div class="sub">Confira em Equipes do App quem é de cada equipe e o líder. Depois, em Aplicativo › Ver Como, veja o que cada um enxerga.</div>
      </div>
      <div class="df"><div class="r">${comLogin.length ? '<button type="button" class="btn" id="lXls">📊 Baixar Excel com as Senhas</button><button type="button" class="btn" id="lImp">🖨️ Imprimir Folhas de Login</button>' : ''}<button type="button" class="btn dark" data-x="1">Concluir</button></div></div></div>`;
    if (!comLogin.length) return;
    $('lXls').onclick = async () => {
      const { carregarExcel } = await import('./excel.js'); await carregarExcel(); const X = window.XLSX;
      const ws = X.utils.aoa_to_sheet([['Como é Chamado', 'Nome Completo', 'Equipe', 'Perfil', 'Site', 'Usuário', 'Senha'], ...comLogin.map(f => [f.apelido, f.nome, f.equipes.join(' / '), f.lider ? 'Líder' : 'Colaborador', SITE, f.usuario, f.senha])]);
      ws['!cols'] = [18, 30, 24, 12, 26, 30, 10].map(w => ({ wch: w }));
      const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Logins'); X.writeFile(wb, 'Logins do Farm Plan - ' + tc(fazenda.nome) + '.xlsx');
    };
    $('lImp').onclick = () => {
      const w = window.open('', '_blank'); if (!w) return aviso('Libere as Janelas (Pop-ups) para Imprimir', 3500);
      const card = (f) => `<div class="c"><div class="t"><img src="${location.origin}/symbol.png"><div><b>Farm Plan</b><span>${esc(tc(fazenda.nome))}</span></div></div>
        <div class="n">${esc(f.apelido)}${f.lider ? ' ⭐ Líder' : ''}</div>
        <table><tr><td>Site</td><td><b>${SITE}</b></td></tr><tr><td>Usuário</td><td><b>${esc(f.usuario)}</b></td></tr><tr><td>Senha</td><td><b class="s">${esc(f.senha)}</b></td></tr></table>
        <ol><li>Abra o site no celular (Chrome ou Safari).</li><li>Entre com o usuário e a senha.</li><li>Toque em Instalar e depois em 🔔 Ligar os Avisos.</li></ol>
        <small>Guarde este papel. A senha é só sua.</small></div>`;
      w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Logins do Farm Plan</title><style>
        @page{size:A4;margin:10mm}body{font-family:Arial,sans-serif;color:#16232A;margin:0}
        .g{display:grid;grid-template-columns:1fr 1fr;gap:0}
        .c{border:1px dashed #9AA6AD;padding:14px 16px;break-inside:avoid;height:66mm;box-sizing:border-box}
        .t{display:flex;gap:8px;align-items:center;margin-bottom:6px}.t img{width:26px}.t b{display:block;color:#114665;font-size:14px}.t span{font-size:11px;color:#5B7384}
        .n{font-size:20px;font-weight:700;margin:2px 0 6px}table{border-collapse:collapse;font-size:13px;margin-bottom:6px}td{padding:2px 10px 2px 0}td:first-child{color:#5B7384}
        .s{font-family:monospace;font-size:17px;letter-spacing:1px}ol{margin:0;padding-left:18px;font-size:11.5px}small{display:block;margin-top:4px;font-size:10.5px;color:#5B7384}
      </style></head><body><div class="g">${comLogin.map(card).join('')}</div><script>window.onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`);
      w.document.close();
    };
  }

  // ---------- ABA 5: EQUIPES DO APP ----------
  function telaEquipes() {
    const ativos = pessoas.filter(p => p.ativo);
    const eMembro = (q, p) => membros.some(m => m.equipe_id === q && m.pessoa_id === p);
    return `<div class="card fs"><h4>Quem Faz Parte de Cada Equipe</h4>
      <div class="sub" style="font-size:13px">Define o que cada pessoa vê no aplicativo: as tarefas em nome dela e as das equipes marcadas aqui.</div>
      <div class="fr">${equipes.map(q => `<label class="fl">Líder da ${esc(tc(q.nome))}<select class="in" data-lider="${q.id}">${opcoesPessoas(q.lider_id, 'Sem Líder: Só Gestor ou Administrativo')}</select></label>`).join('')}</div>
      <div class="sub" style="font-size:13px">Só o líder dá baixa nas tarefas da equipe no aplicativo; os demais membros veem a tarefa. Equipe sem líder: só o gestor ou o administrativo dá baixa. Gestor e administrativo podem dar baixa em qualquer tarefa.</div>
      <div class="scroll"><table class="tbl"><thead><tr><th>Pessoa</th>${equipes.map(q => `<th style="text-align:center">${esc(tc(q.nome))}<div style="margin-top:6px"><button class="btn sm" data-equipe="${q.id}" style="text-transform:none;letter-spacing:0">Editar</button></div></th>`).join('')}</tr></thead><tbody>
      ${ativos.map(p => `<tr><td><b>${esc(tc(p.apelido))}</b> <span class="sub">${esc(tc(p.cargo || ''))}</span></td>${equipes.map(q =>
        `<td style="text-align:center"><input type="checkbox" data-mq="${q.id}" data-mp="${p.id}" ${eMembro(q.id, p.id) ? 'checked' : ''} ${q.lider_id === p.id ? 'disabled title="Líder Sempre Faz Parte"' : ''} style="width:18px;height:18px"></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>${equipes.length ? '' : '<div class="empty">Nenhuma Equipe. Clique em + Nova Equipe.</div>'}</div>`;
  }
  // Marcar / desmarcar membro direto na tabela
  $('conteudo').addEventListener('change', async (e) => {
    const c = e.target.closest('[data-mq]'); if (!c) return;
    const r = c.checked ? await supabase.from('equipe_membros').insert({ equipe_id: c.dataset.mq, pessoa_id: c.dataset.mp })
                        : await supabase.from('equipe_membros').delete().eq('equipe_id', c.dataset.mq).eq('pessoa_id', c.dataset.mp);
    if (r.error) { aviso(erroBonito(r.error.message)); return carregar(); }
    if (c.checked) membros.push({ equipe_id: c.dataset.mq, pessoa_id: c.dataset.mp });
    else membros = membros.filter(m => !(m.equipe_id === c.dataset.mq && m.pessoa_id === c.dataset.mp));
    aviso(c.checked ? 'Incluído na Equipe' : 'Retirado da Equipe');
  });
  $('conteudo').addEventListener('click', (e) => { const b = e.target.closest('[data-equipe]'); if (b) janelaEquipe(equipes.find(q => q.id === b.dataset.equipe)); });
  $('conteudo').addEventListener('change', async (e) => {
    const s = e.target.closest('[data-lider]'); if (!s) return;
    const { error } = await supabase.from('equipes').update({ lider_id: s.value || null }).eq('id', s.dataset.lider);
    if (error) { aviso(erroBonito(error.message)); return carregar(); }
    if (s.value && !membros.some(m => m.equipe_id === s.dataset.lider && m.pessoa_id === s.value)) await supabase.from('equipe_membros').insert({ equipe_id: s.dataset.lider, pessoa_id: s.value });
    aviso('Líder Salvo'); carregar();
  });
  function janelaEquipe(q) {
    const novo = !q; q = q || { nome: '', lider_id: '' };
    const atuais = membros.filter(m => m.equipe_id === q.id).map(m => m.pessoa_id);
    $('modal').innerHTML = `<div class="scrim" data-x="1"></div><form class="fmodal" id="fEq">
      <div class="dh"><h2>${novo ? 'Nova Equipe' : 'Editar ' + esc(tc(q.nome))}</h2><button type="button" class="btn ghost" data-x="1">✕</button></div>
      <div class="fb"><div class="fr"><label class="fl">Nome da Equipe<input class="in" id="qNome" required value="${esc(tc(q.nome))}" placeholder="Ex.: Equipe Cerca"></label>
        <label class="fl">Líder (Dá a Baixa)<select class="in" id="qLider">${opcoesPessoas(q.lider_id, '— Sem Líder —')}</select></label></div>
        <div class="fl">Membros<div class="ckl">${pessoas.filter(p => p.ativo).map(p => `<label><input type="checkbox" data-mb="${p.id}" ${atuais.includes(p.id) ? 'checked' : ''}> ${esc(tc(p.apelido))} <span class="sub">${esc(tc(p.cargo || ''))}</span></label>`).join('')}</div></div></div>
      <div class="df">${novo ? '' : '<button type="button" class="btn danger" id="qApagar">Excluir</button>'}<div class="r"><button type="button" class="btn" data-x="1">Cancelar</button><button type="submit" class="btn dark">✓ Salvar</button></div></div></form>`;
    $('fEq').onsubmit = async (ev) => {
      ev.preventDefault();
      const dados = { fazenda_id: fazenda.id, nome: tc($('qNome').value.trim()), lider_id: $('qLider').value || null };
      const r = novo ? await supabase.from('equipes').insert(dados).select().single() : await supabase.from('equipes').update(dados).eq('id', q.id).select().single();
      if (r.error) return aviso(erroBonito(r.error.message));
      const id = r.data.id, quer = [...document.querySelectorAll('[data-mb]')].filter(c => c.checked).map(c => c.dataset.mb);
      if (dados.lider_id && !quer.includes(dados.lider_id)) quer.push(dados.lider_id);   // líder sempre é membro
      const por = quer.filter(x => !atuais.includes(x)), tirar = atuais.filter(x => !quer.includes(x));
      if (por.length) await supabase.from('equipe_membros').insert(por.map(x => ({ equipe_id: id, pessoa_id: x })));
      if (tirar.length) await supabase.from('equipe_membros').delete().eq('equipe_id', id).in('pessoa_id', tirar);
      fechar(); aviso(novo ? 'Equipe Criada' : 'Equipe Salva'); carregar();
    };
    if (!novo) $('qApagar').onclick = async () => {
      if (!confirm('Excluir a Equipe "' + tc(q.nome) + '"?')) return;
      const { error } = await supabase.from('equipes').delete().eq('id', q.id);
      if (error) return aviso(erroBonito(error.message));
      fechar(); aviso('Equipe Excluída'); carregar();
    };
  }

  function fechar() { $('modal').innerHTML = ''; }
  $('modal').addEventListener('click', (e) => { if (e.target.closest('[data-x]')) fechar(); });
  // Janela aberta (cadastro, senhas) ou 5M em edição: o navegador pergunta antes de sair da página
  addEventListener('beforeunload', (e) => { if (document.querySelector('#modal .fmodal, #modal .drawer') || (aba === 'cincom' && c5Aberta)) { e.preventDefault(); e.returnValue = ''; } });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') fechar(); });

  // Entrada (fica no fim de propósito)
  eu = await quemSouEu();
  montarMenu('cadastros.html');
  if (!eu) location.href = 'index.html';
  else if (!eu.fazenda || !PODE_VER.includes(eu.papel)) $('aviso').textContent = 'Cadastros é Só para Gestor, Administrativo e Consultor.';
  else {
    podeCriar = ['gestor', 'consultor'].includes(eu.papel);
    const { data: fz } = await supabase.from('fazendas').select('*').eq('id', eu.fazenda.id).single();
    fazenda = fz || eu.fazenda;
    $('nomeFazenda').textContent = tc(fazenda.nome).replace(/^Fazenda /, '');
    const { data: eup } = await supabase.from('pessoas').select('apelido').eq('user_id', eu.user.id).maybeSingle();
    const nome = tc(eup?.apelido || eu.user.email.split('@')[0].split('+').pop());
    $('meuNome').textContent = nome; $('meuPapel').textContent = PAPEL[eu.papel] || '';
    $('iniciais').textContent = nome.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
    await carregar();
  }
</script>
</body>
