<!DOCTYPE html>
<!-- FARM PLAN · Gesta'Up · Painel do Gestor (visual do protótipo) -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Farm Plan</title>
  <link rel="icon" href="symbol.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
  <style>
    .so-print{display:none}
    @media print{
      @page{size:A4 portrait;margin:9mm}
      html,body,.shell,.main,#tela{background:#fff!important}
      .side,.mtop,.phead .acts,.toast,#aviso,[data-whats],.drok,[data-fprem],[data-fpnovo],.foot .btn,.mx-strip{display:none!important}
      .shell{display:block}.main{padding:0!important}
      .so-print{display:block;font-size:11px;color:#5B6B75;margin:-8px 0 10px}
      .card{break-inside:avoid;box-shadow:none!important}
      .two{grid-template-columns:1fr!important}
      .drk{grid-template-columns:repeat(3,1fr)!important}
      .kpis{grid-template-columns:repeat(4,1fr)!important}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="lg"><img src="logo.png" alt="Gesta'Up Company"></div><div><b>Farm Plan</b><span>Gesta'Up · Gestão 360°</span></div></div>
    <div class="farm">Fazenda<b id="nomeFazenda">—</b></div>
    <nav class="nav" id="menu"></nav>
    <div class="me"><div class="av" id="iniciais">—</div><div><b id="meuNome">—</b><span id="meuPapel"></span></div><button id="sair">Sair</button></div>
  </aside>
  <div class="main">
    <div class="mtop"><b><img src="icon-192.png" alt="">Farm Plan</b><select id="mnav"><option value="painel.html" selected>Painel</option><option value="index.html">Tarefas da Semana</option><option value="mes.html">Mês</option><option value="plano.html">Plano Anual</option></select></div>
    <div id="aviso" class="empty">Carregando…</div>
    <section id="tela" class="escondido"></section>
  </div>
</div>
<script type="module">
  import { supabase, ANO, SEMANAS_NO_ANO, PAPEL, STATUS, DIAS_CURTO, DIAS_LONGO, MESES_LONGO, tc, esc, semanaDe, inicioDaSemana, quemSouEu, buscarTudo, montarMenu, ddmm, diaDaSemana, media, nf, corEscore, aoMudar } from './comum.js';
  import { agrupar, fmtDur, hhmm, META as META_T } from './tempo.js';
  import { buscarMidias, comEnderecos, miniatura, abrirVisor, selos, prepararVisual, abrirResumoWhatsApp } from './midia.js';
  const $ = (id) => document.getElementById(id);
  const PODE = ['consultor', 'gestor', 'administrativo'];
  let META = 80;                                   // meta do mês: % das tarefas-dia com baixa
  const HOJE = new Date(), SEMANA_ATUAL = semanaDe(HOJE), DIA_HOJE = (HOJE.getDay() + 6) % 7;   // 0 = segunda
  let eu, fz, semana = SEMANA_ATUAL, PESO_T = 0.7;
  let atividades = {}, pessoas = [], equipes = [], setores = [], plano = {}, obs = {}, baixas = {}, semanasComBaixa = new Set();
  let membros = [], itens = [], notas = {}, fora = null, midias = null;
  let ultimo = null, PER_AV = 'semanal';
  let relHoje = null, papeis = {}, eventosT = null;   // eventosT: cronômetro das atividades (SQL 023)     // quem mandou o Relatório do Dia no grupo hoje (SQL 022) e papel de cada login   // midias: fotos/vídeos/áudios/recados da semana atual

  function aviso(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
  $('sair').onclick = async () => { await supabase.auth.signOut(); location.href = 'index.html'; };
  const mesDa = (w) => new Date(inicioDaSemana(w).getTime() + 3 * 864e5).getMonth();
  const semanasDoMes = (m) => { const r = []; for (let w = 1; w <= SEMANAS_NO_ANO; w++) if (mesDa(w) === m) r.push(w); return r; };
  const nomeQuem = (a) => tc(pessoas.find(p => p.id === a.executor_pessoa_id)?.apelido || equipes.find(e => e.id === a.executor_equipe_id)?.nome || '—');
  const nomeSetor = (id) => tc(setores.find(s => s.id === id)?.nome || '—');
  const porExtenso = (w) => { const a = diaDaSemana(w, 0), b = diaDaSemana(w, 6); return a.getMonth() === b.getMonth() ? `${a.getDate()} a ${b.getDate()} de ${MESES_LONGO[b.getMonth()]}` : `${a.getDate()} de ${MESES_LONGO[a.getMonth()]} a ${b.getDate()} de ${MESES_LONGO[b.getMonth()]}`; };
  const pill = (s) => `<span class="pill p${s || 1}">${s ? STATUS[s] : '—'}</span>`;

  // ---------- Regras de baixa (iguais às da Tarefas da Semana) ----------
  const naSemana = (w) => Object.keys(plano).filter(k => +k.split('|')[1] === w).map(k => atividades[k.split('|')[0]]).filter(Boolean);
  const bx = (w, a, d) => baixas[w + '|' + a.id + '|' + d];
  const feito = (w, a, d) => { const b = bx(w, a, d); return b ? b.feito : plano[a.id + '|' + w] === 2; };
  const diasPlan = (a) => (a.dias || []).map((v, i) => v ? i : -1).filter(i => i >= 0);
  const limite = (w) => w < SEMANA_ATUAL ? 7 : w === SEMANA_ATUAL ? DIA_HOJE : 0;           // dias que já passaram
  const semBaixa = (w, a) => plano[a.id + '|' + w] === 2 ? [] : diasPlan(a).filter(d => d < limite(w) && !feito(w, a, d));
  const atrasada = (w, a) => (obs[a.id + '|' + w] || '').startsWith('Atrasada');
  const motivoDe = (w, a) => { for (let d = 0; d < 7; d++) { const b = bx(w, a, d); if (b && !b.feito) return b.motivo; } return null; };

  async function carregar() {
    const [at, p, e, s, pl, m, i, av] = await Promise.all([
      buscarTudo(() => supabase.from('atividades').select('id, nome, dias, local, setor_id, executor_pessoa_id, executor_equipe_id').eq('fazenda_id', fz)),
      buscarTudo(() => supabase.from('pessoas').select('id, apelido, cargo, ativo, setor_id, user_id').eq('fazenda_id', fz).order('apelido')),
      buscarTudo(() => supabase.from('equipes').select('id, nome, lider_id').eq('fazenda_id', fz).order('nome')),
      buscarTudo(() => supabase.from('setores').select('id, nome').eq('fazenda_id', fz).order('nome')),
      buscarTudo(() => supabase.from('planejamento').select('atividade_id, semana, status, observacao').eq('fazenda_id', fz).eq('ano', ANO)),
      buscarTudo(() => supabase.from('equipe_membros').select('equipe_id, pessoa_id, equipes!inner(fazenda_id)').eq('equipes.fazenda_id', fz)),
      buscarTudo(() => supabase.from('contrato_itens').select('id, pessoa_id, tipo').eq('fazenda_id', fz).eq('ativo', true)),
      buscarTudo(() => supabase.from('avaliacoes').select('item_id, semana, nota, nsa').eq('fazenda_id', fz).eq('ano', ANO))
    ]);
    atividades = {}; at.forEach(a => atividades[a.id] = a);
    pessoas = p; equipes = e; setores = s; membros = m; itens = i;
    plano = {}; obs = {}; pl.forEach(l => { plano[l.atividade_id + '|' + l.semana] = l.status; if (l.observacao) obs[l.atividade_id + '|' + l.semana] = l.observacao; });
    notas = {}; av.forEach(x => { if (!x.nsa && x.nota != null) notas[x.item_id + '|' + x.semana] = +x.nota; });
    await carregarBaixas();
    const { data: fp, error: fpe } = await supabase.from('fora_do_plano').select('*').eq('fazenda_id', fz).eq('ano', ANO).eq('semana', SEMANA_ATUAL).order('registrado_em');
    fora = fpe ? null : (fp || []);
    midias = await buscarMidias(fz, ANO, SEMANA_ATUAL);
    const [{ data: rd, error: rde }, { data: ac }] = await Promise.all([
      supabase.from('relatorios_dia').select('pessoa_id, user_id, enviado_em, feitas, total').eq('fazenda_id', fz).eq('ano', ANO).eq('semana', SEMANA_ATUAL).eq('dia', DIA_HOJE),
      supabase.from('acessos').select('user_id, papel').eq('fazenda_id', fz)
    ]);
    relHoje = rde ? null : (rd || []);
    const ex = await supabase.from('execucoes').select('*, atividades(nome, como_fazer)').eq('fazenda_id', fz).gte('em', new Date(Date.now() - 21 * 864e5).toISOString()).order('em');
    eventosT = ex.error ? null : (ex.data || []);
    papeis = {}; (ac || []).forEach(x => papeis[x.user_id] = x.papel);
    if (midias) await comEnderecos(midias.filter(r => r.dia === DIA_HOJE));
    prepararVisual();
    $('aviso').classList.add('escondido'); $('tela').classList.remove('escondido');
    desenhar();
  }
  // Baixas: semana escolhida + semanas do mês atual (para a Meta do Mês)
  async function carregarBaixas() {
    const ws = [...new Set([semana, ...semanasDoMes(mesDa(SEMANA_ATUAL)).filter(w => w <= SEMANA_ATUAL)])].filter(w => !semanasComBaixa.has(w));
    if (!ws.length) return;
    const b = await buscarTudo(() => supabase.from('baixas').select('atividade_id, semana, dia, feito, motivo').eq('fazenda_id', fz).eq('ano', ANO).in('semana', ws));
    b.forEach(x => baixas[x.semana + '|' + x.atividade_id + '|' + x.dia] = x);
    ws.forEach(w => semanasComBaixa.add(w));
  }

  // ---------- Meta do mês: % das tarefas-dia já vencidas que tiveram baixa ----------
  function metaMes() {
    let pl = 0, dn = 0; const ws = semanasDoMes(mesDa(SEMANA_ATUAL)).filter(w => w <= SEMANA_ATUAL);
    ws.forEach(w => { const lim = w < SEMANA_ATUAL ? 7 : DIA_HOJE + 1; naSemana(w).forEach(a => diasPlan(a).forEach(d => { if (d < lim) { pl++; if (feito(w, a, d)) dn++; } })); });
    return { pl, dn, p: pl ? Math.round(dn / pl * 100) : 0, ws };
  }
  function barraMeta() {
    const r = metaMes(), ok = r.p >= META, cor = ok ? 'var(--s2)' : r.p >= META - 20 ? 'var(--s5)' : 'var(--s4)';
    return `<div class="meta"><div class="mt"><b>Meta do Mês</b><span>${META}% das Tarefas com Baixa · Sem. ${r.ws[0]} a ${r.ws[r.ws.length - 1]}</span></div>
      <div class="mbar"><i style="width:${Math.min(100, r.p)}%;background:${cor}"></i><em style="left:${META}%"></em></div>
      <div class="mv"><b class="num">${r.p}%</b><span>${r.dn} de ${r.pl} Tarefas-Dia até Hoje</span></div></div>`;
  }

  // ---------- Relatório do dia (só na semana atual) ----------
  const tagAtr = (w, a) => { const m = (obs[a.id + '|' + w] || '').match(/(\d+)\s*$/); return atrasada(w, a) ? ` <span class="late">↻ ${m ? m[1] : ''}</span>` : ''; };
  const IMPREVISTOS = ['Máquina Quebrou', 'Animal Doente', 'Animal Morto', 'Cerca Arrebentada', 'Falta de Água', 'Acidente', 'Gado Fugiu'];
  const ehImp = (x) => x.tipo === 'imprevisto';
  const quemFora = (x) => tc(pessoas.find(p => p.id === x.pessoa_id)?.apelido || equipes.find(e => e.id === x.equipe_id)?.nome || '');
  function setorDe(q) {
    if (!q) return null;
    const id = q.slice(2), ehPessoa = q.startsWith('p:');
    if (ehPessoa) { const p = pessoas.find(x => x.id === id); if (p?.setor_id) return p.setor_id; }
    const cont = {}; Object.values(atividades).forEach(a => { if ((ehPessoa ? a.executor_pessoa_id : a.executor_equipe_id) === id && a.setor_id) cont[a.setor_id] = (cont[a.setor_id] || 0) + 1; });
    return Object.entries(cont).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
  }
  function abrirFora(tipo = 'fora') {
    const nomes = [...new Set(Object.values(atividades).map(a => tc(a.nome)))].sort((a, b) => a.localeCompare(b, 'pt'));
    const m = document.createElement('div'); m.id = 'modal';
    m.innerHTML = `<div class="scrim" data-x="1"></div><form class="fmodal" id="fFora"><div class="dh"><h2 id="fpTit">Lançar Fora do Plano</h2><button type="button" class="btn sm ghost" data-x="1">✕</button></div>
      <div class="fb"><div class="seg" id="fpTipo"><button type="button" data-tp="fora">✓ Fora do Plano</button><button type="button" data-tp="imprevisto">⚠ Imprevisto</button></div>
        <div class="motg" id="fpImp" style="display:none">${IMPREVISTOS.map(x => `<button type="button" data-impr="${x}">${x}</button>`).join('')}</div>
        <label class="fl"><span id="fpPerg">O Que Foi Feito?</span><input class="in" name="nome" list="libFora" required autocomplete="off" placeholder="Buscar na Lista de Atividades ou Escrever"></label>
        <datalist id="libFora">${nomes.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
        <div class="fr"><label class="fl">Dia<select class="in" name="dia">${DIAS_LONGO.map((n, i) => i <= DIA_HOJE ? `<option value="${i}" ${i === DIA_HOJE ? 'selected' : ''}>${n} ${ddmm(diaDaSemana(SEMANA_ATUAL, i))}</option>` : '').join('')}</select></label>
          <label class="fl">Quem Fez?<select class="in" name="quem" required><option value="">Selecionar</option><optgroup label="Equipes">${equipes.map(e => `<option value="e:${e.id}">${esc(tc(e.nome))}</option>`).join('')}</optgroup><optgroup label="Pessoas">${pessoas.filter(p => p.ativo !== false).map(p => `<option value="p:${p.id}">${esc(tc(p.apelido))}</option>`).join('')}</optgroup></select></label>
          <label class="fl">Setor<select class="in" name="setor"><option value="">—</option>${setores.map(s => `<option value="${s.id}">${esc(tc(s.nome))}</option>`).join('')}</select></label></div>
        <label class="fl">Observação<input class="in" name="obs" placeholder="Local, Lote, o Que Aconteceu"></label></div>
      <div class="df"><div class="r"><button type="button" class="btn" data-x="1">Cancelar</button><button class="btn pri">Salvar</button></div></div></form>`;
    document.body.appendChild(m);
    const f0 = m.querySelector('form');
    const tipoSet = (t) => { f0.dataset.tipo = t; const imp = t === 'imprevisto';
      m.querySelectorAll('#fpTipo button').forEach(b => b.classList.toggle('on', b.dataset.tp === t));
      m.querySelector('#fpImp').style.display = imp ? '' : 'none';
      m.querySelector('#fpTit').textContent = imp ? 'Registrar Imprevisto' : 'Lançar Fora do Plano';
      m.querySelector('#fpPerg').textContent = imp ? 'O Que Aconteceu?' : 'O Que Foi Feito?';
      f0.nome.placeholder = imp ? 'Ex.: Trator 7 Quebrou na Roçada' : 'Buscar na Lista de Atividades ou Escrever';
      if (imp) f0.nome.removeAttribute('list'); else f0.nome.setAttribute('list', 'libFora');
      f0.obs.placeholder = imp ? 'Onde Foi? O Que Precisa Fazer?' : 'Local, Lote, o Que Aconteceu'; };
    tipoSet(tipo);
    m.onclick = (e) => { if (e.target.closest('[data-x]')) return m.remove();
      const tp = e.target.closest('[data-tp]'); if (tp) return tipoSet(tp.dataset.tp);
      const im = e.target.closest('[data-impr]'); if (im) { f0.nome.value = im.dataset.impr; f0.obs.focus(); } };
    m.querySelector('form').onsubmit = async (e) => {
      e.preventDefault(); const f = e.target, q = f.quem.value;
      const reg = { fazenda_id: fz, ano: ANO, semana: SEMANA_ATUAL, dia: +f.dia.value, nome: f.nome.value.trim(), obs: f.obs.value.trim() || null, setor_id: f.setor.value || null,
        pessoa_id: q.startsWith('p:') ? q.slice(2) : null, equipe_id: q.startsWith('e:') ? q.slice(2) : null, registrado_por: eu.user.id, tipo: f.dataset.tipo };
      const { data, error } = await supabase.from('fora_do_plano').insert(reg).select().single();
      if (error) return aviso('Não Foi Possível Salvar: ' + error.message);
      fora.push({ id: String(Date.now()), ...reg, ...(data || {}) }); m.remove(); desenhar(); aviso(reg.tipo === 'imprevisto' ? 'Imprevisto Registrado' : 'Lançado Fora do Plano');
    };
    // Ao escolher quem fez, já puxa o setor: o do cadastro da pessoa, ou o mais comum nas atividades dela/da equipe
    m.querySelector('[name=quem]').onchange = (e) => { const s = setorDe(e.target.value); if (s) m.querySelector('[name=setor]').value = s; };
    m.querySelector('[name=nome]').focus();
  }
  async function removerFora(id) {
    const { error } = await supabase.from('fora_do_plano').delete().eq('id', id);
    if (error) return aviso('Não Foi Possível Remover: ' + error.message);
    fora = fora.filter(x => x.id !== id); desenhar(); aviso('Removido');
  }
  // ---------- Fotos, vídeos, áudios e recados do app ----------
  const midHoje = () => (midias || []).filter(r => r.dia === DIA_HOJE);
  function nomeDaMidia(r) {
    const quem = tc(pessoas.find(p => p.id === r.pessoa_id)?.apelido || 'Gestor');
    if (r.origem === 'baixa') return tc(atividades[r.atividade_id]?.nome || 'Tarefa') + ' · ' + quem;
    if (r.origem === 'fora') return tc((fora || []).find(f => f.id === r.fora_id)?.nome || 'Fora do Plano') + ' · ' + quem;
    return 'Recado de ' + quem;
  }
  // Quem já mandou o Relatório do Dia no grupo: colaboradores e líderes com login no app
  function blocoRelatorios() {
    if (relHoje === null) return `<div class="drh" style="margin-top:14px">📲 Relatório no Grupo Hoje</div><div class="sub" style="font-size:12px">Falta Rodar o SQL 022 no Supabase.</div>`;
    const comApp = pessoas.filter(p => p.user_id && p.ativo !== false && (papeis[p.user_id] ? ['colaborador', 'lider'].includes(papeis[p.user_id]) : true) && p.user_id !== eu.user.id);
    const env = (p) => relHoje.find(r => r.user_id === p.user_id || r.pessoa_id === p.id);
    const sim = comApp.filter(env).sort((a, b) => env(a).enviado_em.localeCompare(env(b).enviado_em)), nao = comApp.filter(p => !env(p));
    const hh = (iso) => new Date(iso).toTimeString().slice(0, 5);
    return `<div class="drh" style="margin-top:14px">📲 Relatório no Grupo Hoje <span style="background:${nao.length ? 'var(--s5-soft);color:var(--s5)' : 'var(--s2-soft);color:var(--s2)'}">${sim.length} de ${comApp.length}</span></div>
      ${comApp.length ? `<div class="drz">${sim.map(p => { const r = env(p); return `<span style="background:var(--s2-soft);color:var(--s2)">✓ ${esc(tc(p.apelido))} · ${hh(r.enviado_em)}${r.total ? ` · ${r.feitas}/${r.total}` : ''}</span>`; }).join('')}${nao.map(p => `<span style="background:var(--s4-soft);color:var(--s4)">✗ ${esc(tc(p.apelido))}</span>`).join('')}</div>`
        : '<div class="sub" style="font-size:12px">Ninguém da Equipe Tem Login no App Ainda. Crie em Cadastros → Colaboradores.</div>'}`;
  }
  // Cronômetro: quem está trabalhando agora, pausado, e o que terminou hoje com a meta
  function blocoTempo() {
    if (eventosT === null) return `<div class="drh" style="margin-top:14px">⏱ Cronômetro</div><div class="sub" style="font-size:12px">Falta Rodar o SQL 023 no Supabase.</div>`;
    const X = agrupar(eventosT), hoje = new Date().toDateString();
    const and = X.filter(x => x.estado !== 'fim'), fim = X.filter(x => x.estado === 'fim' && new Date(x.fim).toDateString() === hoje);
    const cm = fim.filter(x => x.meta_status), bt = cm.filter(x => x.meta_status === 'bateu').length;
    const nm = (x) => tc(atividades[x.atividade_id]?.nome || x.ativ?.nome || 'Atividade'), pq = (x) => tc(pessoas.find(p => p.id === x.pessoa_id)?.apelido || '');
    return `<div class="drh" style="margin-top:14px">⏱ Cronômetro Hoje <span style="background:var(--s3-soft);color:var(--s3)">${and.length} Andando · ${fim.length} Terminadas</span></div>
      ${and.map(x => `<div style="padding:5px 0;border-top:1px solid var(--line2);font-size:13px;display:flex;gap:8px"><span>${x.estado === 'rodando' ? '▶' : '⏸'}</span><div style="flex:1"><b>${esc(nm(x))}</b><div class="sub" style="font-size:12px">${esc(pq(x))} · Desde ${hhmm(x.inicio)}${x.estado === 'pausado' ? ' · Pausado: ' + esc(x.motivoPausa || '') : ''}${x.revisar ? ' · <b style="color:var(--s4)">⚠ Revisar</b>' : ''}</div></div><b class="num">${fmtDur(x.trabalhado)}</b></div>`).join('')}
      ${fim.map(x => `<div style="padding:5px 0;border-top:1px solid var(--line2);font-size:13px;display:flex;gap:8px"><span>${x.meta_status ? META_T[x.meta_status][0] : '■'}</span><div style="flex:1"><b>${esc(nm(x))}</b><div class="sub" style="font-size:12px">${esc(pq(x))} · ${hhmm(x.inicio)} → ${hhmm(x.fim)}${x.meta_status ? ' · ' + META_T[x.meta_status][1] : ''}</div></div><b class="num">${fmtDur(x.trabalhado)}</b></div>`).join('')}
      ${and.length || fim.length ? `<div class="sub" style="font-size:12px;margin-top:4px">${cm.length ? `Meta Batida Hoje: <b>${Math.round(bt / cm.length * 100)}%</b> · ` : ''}<a class="sub" href="execucao.html">Ver Tempo e Meta ›</a></div>` : '<div class="sub" style="font-size:12px">Ninguém Ligou o Cronômetro Hoje.</div>'}`;
  }
  function blocoMidias() {

  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-pdfp]')) { const t = document.title; document.title = `Painel Semana ${semana} - ${tc(eu.fazenda.nome)}`; setTimeout(() => { print(); document.title = t; }, 100); return; }
    const b = e.target.closest('[data-xlsp]'); if (!b || !ultimo) return;
    b.disabled = true; const txt = b.textContent; b.textContent = 'Montando…';
    import('./excel.js').then(m => m.exportarExcel({ titulo: `Painel Semana ${semana} - ${tc(eu.fazenda.nome)}`, semTabelas: true, extras: excelPainel() }))
      .catch(er => alert(er.message)).finally(() => { b.disabled = false; b.textContent = txt; });
  });

  // ---------- Status pelo painel ----------
  function fecharMenu() { document.querySelector('.pop')?.remove(); }
  function abrirMenu(el) {
    fecharMenu();
    const a = atividades[el.dataset.ps], w = semana, atual = plano[a.id + '|' + w] || 0;
    const pop = document.createElement('div'); pop.className = 'pop';
    pop.innerHTML = `<div class="t"><b>${esc(tc(a.nome))}</b>Semana ${w}</div>` + [1, 3, 2, 4, 5].map(s => `<button data-st="${s}" class="${atual === s ? 'on' : ''}"><i style="background:var(--s${s})"></i>${STATUS[s]}${atual === s ? ' ✓' : ''}</button>`).join('');
    document.body.appendChild(pop);
    const r = el.getBoundingClientRect(), ph = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - pop.offsetWidth - 8, r.right - pop.offsetWidth)) + 'px';
    pop.style.top = (r.bottom + ph + 8 > innerHeight ? Math.max(8, r.top - ph - 4) : r.bottom + 4) + 'px';
    pop.onclick = async (e) => {
      const b = e.target.closest('[data-st]'); if (!b) return; fecharMenu();
      const novo = +b.dataset.st;
      const { error } = await supabase.from('planejamento').upsert({ fazenda_id: fz, atividade_id: a.id, ano: ANO, semana: w, status: novo }, { onConflict: 'atividade_id,ano,semana' });
      if (error) return aviso('Erro: ' + error.message);
      plano[a.id + '|' + w] = novo; desenhar(); aviso(tc(a.nome) + ': ' + STATUS[novo]);
    };
    setTimeout(() => document.addEventListener('pointerdown', function fora(ev) { if (!pop.contains(ev.target)) { fecharMenu(); document.removeEventListener('pointerdown', fora, true); } }, true), 0);
  }
  $('tela').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-wk]');
    if (b) { const v = +b.dataset.wk; semana = v ? Math.min(SEMANAS_NO_ANO, Math.max(1, semana + v)) : SEMANA_ATUAL; await carregarBaixas(); return desenhar(); }
    const ps = e.target.closest('[data-ps]'); if (ps) return abrirMenu(ps);
    const fn = e.target.closest('[data-fpnovo]'); if (fn) return abrirFora(fn.dataset.fpnovo);
    const fr = e.target.closest('[data-fprem]'); if (fr) return removerFora(fr.dataset.fprem);
    const ok = e.target.closest('[data-ok]'); if (ok) { ok.disabled = true; return darBaixa(ok.dataset.ok); }
    const vh = e.target.closest('[data-vh]'); if (vh) return abrirVisor(midHoje(), +vh.dataset.vh, nomeDaMidia);
    if (e.target.closest('[data-whats]')) return resumoWhatsApp();
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharMenu(); });

  // ---------- Entrada ----------
  eu = await quemSouEu();
  montarMenu('painel.html');
  if (!eu) location.href = 'index.html';
  else if (!eu.fazenda || !PODE.includes(eu.papel)) location.href = 'index.html';
  else {
    fz = eu.fazenda.id;
    $('nomeFazenda').textContent = tc(eu.fazenda.nome).replace(/^Fazenda /, '');
    const { data: eup } = await supabase.from('pessoas').select('apelido').eq('user_id', eu.user.id).maybeSingle();
    const nome = tc(eup?.apelido || eu.user.email.split('@')[0].split('+').pop());
    $('meuNome').textContent = nome; $('meuPapel').textContent = PAPEL[eu.papel] || '';
    $('iniciais').textContent = nome.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
    const { data: fzd } = await supabase.from('fazendas').select('peso_tarefas, meta_mes').eq('id', fz).maybeSingle();
    { const { data: fp } = await supabase.from('fazendas').select('periodo_avaliacao').eq('id', fz).maybeSingle(); if (fp?.periodo_avaliacao) PER_AV = fp.periodo_avaliacao; }
    if (fzd?.peso_tarefas != null) PESO_T = fzd.peso_tarefas / 100;
    if (fzd?.meta_mes != null) META = fzd.meta_mes;   // Meta do Mês: Cadastros › Geral
    await carregar();
    // O que a equipe faz no app aparece aqui sozinho
    aoMudar(fz, ['baixas', 'planejamento', 'execucoes', 'fora_do_plano', 'midias', 'relatorios_dia'], () => { baixas = {}; semanasComBaixa = new Set(); return carregar(); });
  }
</script>
</body>
</html>
