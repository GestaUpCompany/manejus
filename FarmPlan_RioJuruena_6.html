<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farm Plan Rio Juruena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface2:#F7F6F1; --line:#E2E0D6; --line2:#ECEAE2;
  --ink:#16232A; --ink2:#44525A; --muted:#6E787C;
  --navy:#114665; --navy-2:#0C3650; --navy-ink:#FFFFFF; --navy-soft:#DCE8EE;
  --green:#1E9A47; --green-ink:#FFFFFF; --green-soft:#DDF3E3; --brand-green:#20A44B;
  --s1:#5B7384; --s1-soft:#E3E9ED; --s2:#20A44B; --s2-soft:#DDF3E3; --s3:#2B79AE; --s3-soft:#DCEAF4; --s4:#C23D2B; --s4-soft:#F7E0DB; --s5:#C98A16; --s5-soft:#F6EBD2;
  --empty:#EFEDE6; --focus:#2B79AE; --shadow:0 1px 2px rgba(18,70,95,.06),0 6px 24px rgba(18,70,95,.06);
  --r:10px; --fd:"Archivo","Public Sans",system-ui,sans-serif; --fb:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E181D; --surface:#15232A; --surface2:#1A2B33; --line:#273A43; --line2:#20323A;
  --ink:#E8EEF0; --ink2:#B7C4CA; --muted:#8C9BA2; --navy:#0B2E3F; --navy-2:#082533; --navy-soft:#1E3C4B;
  --green:#25AE55; --green-soft:#193A27; --s1:#8BA2B2; --s1-soft:#22343C; --s2:#2DB45C; --s2-soft:#193A27; --s3:#4A9AD0; --s3-soft:#1A3446; --s4:#E0634F; --s4-soft:#3F2320; --s5:#DDA33A; --s5-soft:#3A2F17;
  --empty:#1D2D35; --shadow:0 1px 2px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E181D; --surface:#15232A; --surface2:#1A2B33; --line:#273A43; --line2:#20323A;
  --ink:#E8EEF0; --ink2:#B7C4CA; --muted:#8C9BA2; --navy:#0B2E3F; --navy-2:#082533; --navy-soft:#1E3C4B;
  --green:#25AE55; --green-soft:#193A27; --s1:#8BA2B2; --s1-soft:#22343C; --s2:#2DB45C; --s2-soft:#193A27; --s3:#4A9AD0; --s3-soft:#1A3446; --s4:#E0634F; --s4-soft:#3F2320; --s5:#DDA33A; --s5-soft:#3A2F17;
  --empty:#1D2D35; --shadow:0 1px 2px rgba(0,0,0,.3);}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}

/* relatórios */
.ctip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.cb{padding:4px 18px 16px}
.hb{display:grid;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px minmax(0,80px);gap:10px;align-items:center;font-size:13px}
.hbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{height:10px;background:var(--empty);border-radius:99px;overflow:hidden}.hbt i{display:block;height:100%;border-radius:0 4px 4px 0}
.hbr b{text-align:right}.hbr small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dp{display:grid;gap:2px;font-size:13px}
.dpa,.dpr{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center}
.dpr{height:26px}.dpl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dpv{text-align:right;font-weight:700}
.dps{position:relative;height:100%}
.dpa .dps{height:16px}.dpa em{position:absolute;transform:translateX(-50%);font-style:normal;font-size:10.5px;color:var(--muted)}
.dps .g{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.dps .ref{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed var(--s1)}
.dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);background:var(--navy);box-shadow:0 0 0 2px var(--surface)}
.dot.sc-g{background:var(--s2)}.dot.sc-a{background:var(--s5)}.dot.sc-b{background:var(--s4)}
.dpn{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px}.dpn i{width:14px;border-top:2px dashed var(--s1)}
.lc{width:100%;height:auto;display:block}
.hm{border-collapse:separate;border-spacing:2px;font-size:11.5px;width:auto}
.hm th{font-weight:600;color:var(--muted);padding:2px 6px;text-align:left;white-space:nowrap;font-size:11px}
.hm thead th{text-align:center}
.hm td{min-width:34px;height:26px;text-align:center;border-radius:4px;background:var(--surface2);font-variant-numeric:tabular-nums}
.sr{display:grid;grid-template-columns:120px 1fr 86px 50px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.sr:first-child{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0}
.sr>span:nth-child(2){display:block}.sr b{text-align:right}.sr>span:last-child{text-align:right}
.stk{display:flex;gap:2px;height:14px;width:100%}.stk i{display:block;min-width:2px}.stk i:first-child{border-radius:4px 0 0 4px}.stk i:last-child{border-radius:0 4px 4px 0}
.sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.smc{border:1px solid var(--line2);border-radius:9px;padding:10px 12px}
.smh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.smh span{font-weight:700}
.smb{display:flex;gap:2px;height:60px;align-items:flex-end;border-bottom:1px solid var(--line);background:linear-gradient(var(--line2) 1px,transparent 1px) 0 0/100% 50%}
.smb span{flex:1;height:100%;display:flex;align-items:flex-end}.smb i{display:block;width:100%;border-radius:3px 3px 0 0}
.smx{display:flex;gap:2px;font-size:9.5px;color:var(--muted)}.smx span{flex:1;text-align:center}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;height:190px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.col small{font-size:11px;color:var(--ink2)}.col em{font-style:normal;font-size:11.5px;color:var(--muted)}
.cbar{width:70%;display:flex;flex-direction:column;gap:2px;border-radius:4px 4px 0 0;overflow:hidden}.cbar i{display:block;min-height:0}
@media (max-width:520px){.hbr{grid-template-columns:90px 1fr 40px}.hbr small{display:none}.sr{grid-template-columns:90px 1fr 48px}.sr>span:last-child{display:none}.cols{gap:3px}}
/* shell */
.late{display:inline-block;margin-left:6px;background:var(--s4);color:#fff;border-radius:4px;padding:0 5px;font-size:10.5px;font-weight:700;line-height:1.55;white-space:nowrap;vertical-align:1px;text-decoration:none}
.chip.cr{background:var(--s4-soft);box-shadow:inset 3px 0 0 var(--s4)}
.chip .late{margin-left:auto;flex:none}
.a-task .late{margin:2px 0 0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.85)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#9FB0B8}
.sync[data-st="live"]::before{background:#3BD06F;box-shadow:0 0 0 3px rgba(59,208,111,.25)}
.sync[data-st="off"]::before,.sync[data-st="ro"]::before{background:#E6B04A}
.mtop .sync{font-family:var(--fb);font-size:10.5px;margin-left:6px}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--navy);color:var(--navy-ink);padding:22px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:grid;gap:10px}
.brand .lg{background:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:center}
.brand .lg img{height:74px;width:auto;display:block}
.brand b{font-family:var(--fd);font-size:20px;font-weight:800;display:block;letter-spacing:-.02em}
.brand span{font-size:12px;opacity:.75}
.farm{border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 12px;font-size:11px;opacity:.95}
.farm b{display:block;font-size:14px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:rgba(255,255,255,.82);padding:9px 10px;border-radius:7px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--brand-green)}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:8px 4px}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;border-top:1px solid rgba(255,255,255,.14);padding-top:14px;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.side .av{background:#fff}
.side .me b{display:block;font-size:13px}
.main{min-width:0;padding:26px 30px 60px}
.mtop{display:none}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12.5px;color:var(--muted)}
.phead h1{font-size:30px;font-weight:800;line-height:1.1;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--s4);border-color:var(--s4-soft)}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cardh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 10px}
.cardh h3{font-size:16px;font-weight:700}
.cardh small{color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:14px 18px}
.kpi small{color:var(--ink2);font-size:12.5px}
.kpi b{display:block;font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.15}
.kpi span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 4px 0 10px;font-size:13px;color:var(--muted)}
.sel select{border:0;background:transparent;padding:7px 4px;font-weight:600;color:var(--ink);max-width:150px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:190px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p1{background:var(--s1-soft);color:var(--ink2)} .p2{background:var(--s2-soft);color:var(--s2)} .p3{background:var(--s3-soft);color:var(--s3)} .p4{background:var(--s4-soft);color:var(--s4)} .p5{background:var(--s5-soft);color:var(--s5)}
.urg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:12px}
.u1{background:var(--s4-soft);color:var(--s4)} .u2{background:var(--s5-soft);color:var(--s5)} .u3{background:var(--s1-soft);color:var(--ink2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .sub{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
.bars .row{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;padding:5px 18px;font-size:13px}
.track{height:8px;background:var(--empty);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--navy);border-radius:99px}
.navyfill{background:var(--navy)}
[data-theme="dark"] .track i,.dk .track i{background:var(--s3)}
.foot{padding:10px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:90;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700}
.seg{display:inline-flex;background:var(--empty);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--ink2);font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* annual grid */
.ag-wrap{overflow:auto;max-height:calc(100vh - 250px);min-height:360px;border-radius:0 0 var(--r) var(--r)}
.ag{display:grid;font-size:13px;width:max-content;min-width:100%}
.ag .h,.ag .c{height:42px;display:flex;align-items:center;border-bottom:1px solid var(--line2);background:var(--surface)}
.ag .stick{position:sticky;z-index:2}
.ag .hd{position:sticky;top:0;z-index:3;background:var(--surface);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;border-bottom:1px solid var(--line)}
.ag .hd.stick{z-index:4}
.ag .hd{height:64px;align-items:flex-end;padding-bottom:9px}
.ag .nm{padding:0 10px 0 16px;cursor:pointer;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;border-right:1px solid var(--line2)}
.ag .nm span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .nm1{font-weight:600}
.ag .nm2{font-size:11.5px;color:var(--muted)}
.ag .nm:hover .nm1{color:var(--s3);text-decoration:underline}
.ag .tx{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.ag .wk{justify-content:center;padding:0 4px}
.ag .hw span{font-size:11px;font-variant-numeric:tabular-nums}
.ag .wk b{display:block;width:20px;height:24px;border-radius:3px;background:var(--empty)}
.ag .wk.cur{background:var(--navy-soft)}
.ag .wk:hover b{outline:2px solid var(--ink2)}
.ag .wk[data-s="1"] b{background:var(--s1)} .ag .wk[data-s="2"] b{background:var(--s2)} .ag .wk[data-s="3"] b{background:var(--s3)} .ag .wk[data-s="4"] b{background:var(--s4)} .ag .wk[data-s="5"] b{background:var(--s5)}
.ag .mo{border-left:1px solid var(--line)}
.ag .hw{flex-direction:column;justify-content:flex-end;padding-bottom:4px;height:64px;cursor:pointer;gap:2px}
.ag .hw .ld{width:20px;background:var(--s3-soft);border-radius:2px 2px 0 0;display:flex;align-items:flex-end}
.ag .hw .ld i{display:block;width:100%;background:var(--s3);border-radius:2px 2px 0 0}
.ag .hw.cur{color:#fff}
.ag .hw.cur span{background:var(--navy);border-radius:4px;padding:0 3px;color:#fff}
.ag .hw:hover span{color:var(--s3)}
.ag .mlab{position:absolute;top:4px;font-size:10.5px;color:var(--ink2);font-weight:700}
.ag.painting .wk{cursor:crosshair;touch-action:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.brush{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.brush button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--ink2)}
.brush button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.brush button.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:200px}
.pop .t{padding:6px 8px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line2);margin-bottom:4px}
.pop .t b{color:var(--ink);display:block;font-size:13px}
.pop button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:7px 8px;border-radius:6px;text-align:left;font-size:13px}
.pop button:hover{background:var(--surface2)}
.pop button i{width:11px;height:11px;border-radius:3px}
.pop button.on{font-weight:700}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,25,32,.38);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:71;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .dh h2{font-size:20px}
.drawer .db{overflow:auto;padding:18px 20px 30px;display:grid;gap:14px}
.drawer .df{display:flex;justify-content:space-between;gap:8px;padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.fs{padding:14px 16px;display:grid;gap:12px}
.fs>h4{margin:0;font-family:var(--fd);font-size:15px;display:flex;gap:8px;align-items:center}
.fs>h4 em{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-size:12px}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fl{display:grid;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:600}
.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;font-weight:500;color:var(--ink)}
textarea.in{min-height:64px;resize:vertical}
.dows{display:flex;gap:4px;flex-wrap:wrap}
.dows button,.chipb{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-weight:600;font-size:12.5px}
.dows button.on,.chipb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.wmap{display:grid;grid-template-columns:repeat(53,1fr);gap:2px}
.wmap button{height:22px;border:0;border-radius:3px;background:var(--empty);padding:0}

  s.acts.forEach(a=>{const w={};for(const k in a.wk)w[+k]=a.wk[k];a.wk=w;const o={};for(const k in a.obs)o[+k]=a.obs[k];a.obs=o;});
  s.people=s.people.filter(p=>p.st||p.t.concat(p.c).some(i=>Object.keys(i[1]).length));
  s.done={}; s.extras=[]; s.notes={}; s.ind={5:{10:4,11:6}}; s.nextId=s.acts.length+1;
  return s;
}

function pushUndo(label){UNDO.push({label,snap:JSON.stringify({acts:S.acts,done:S.done,extras:S.extras})});if(UNDO.length>30)UNDO.shift()}
function undo(){const u=UNDO.pop();if(!u)return;const o=JSON.parse(u.snap);S.acts=o.acts;S.done=o.done;S.extras=o.extras;save();render();toast('Desfeito: '+u.label)}

const actById=id=>S.acts.find(a=>a.id===id);
const inWeek=w=>S.acts.filter(a=>a.wk[w]);
const doneArr=(w,id)=>S.done[w+'|'+id]||[0,0,0,0,0,0,0];
const dayDone=(w,a,d)=>a.wk[w]===2||!!doneArr(w,a.id)[d];
const dayTasks=(w,d)=>inWeek(w).filter(a=>a.days[d]);
const teamsOf=ap=>Object.keys(S.teams).filter(t=>S.teams[t].includes(ap));
const mine=(a,ap)=>a.qf===ap||teamsOf(ap).includes(a.qf);
const people=()=>S.people;
const pBy=ap=>S.people.find(p=>p.a===ap);
const doers=()=>{const s=new Set(S.acts.map(a=>a.qf).filter(Boolean));S.people.forEach(p=>s.add(p.a));Object.keys(S.teams).forEach(t=>s.add(t));return [...s].sort((a,b)=>a.localeCompare(b,'pt'))};
const coords=()=>[...new Set(S.acts.map(a=>a.co).filter(Boolean).concat(S.people.map(p=>p.a)))].sort((a,b)=>a.localeCompare(b,'pt'));
const setores=()=>[...new Set(S.sectors.map(s=>s[0]).concat(S.acts.map(a=>a.st)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
function pastPending(w,a){ // dias já passados sem baixa
  if(a.wk[w]===2) return [];
  const lim=w<CUR?7:w===CUR?TODAY_D:0;
  const r=[];for(let d=0;d<lim;d++) if(a.days[d]&&!doneArr(w,a.id)[d]) r.push(d);
  return r;
}
function setWeek(a,w,s){
  if(!s){delete a.wk[w];delete S.done[w+'|'+a.id];return}
  a.wk[w]=s;
  if(s===2) S.done[w+'|'+a.id]=a.days.map(x=>x?1:0);
  if(s===1) delete S.done[w+'|'+a.id];
}
function setDay(w,a,d,val){
  let arr=doneArr(w,a.id).slice();
  if(a.wk[w]===2) arr=a.days.map(x=>x?1:0);
  arr[d]=val?1:0; S.done[w+'|'+a.id]=arr;
  const plan=a.days.map((x,i)=>x?i:-1).filter(i=>i>=0);
  const n=plan.filter(i=>arr[i]).length, cur=a.wk[w]||1;
  if(plan.length&&n===plan.length) a.wk[w]=2;
  else if(arr.some(Boolean)) a.wk[w]=(cur===4||cur===5)?cur:3;
  else a.wk[w]=(cur===2||cur===3)?1:cur;
  save();
}
/* atividade não feita na semana passada: marca Atrasado e passa para a semana seguinte como Planejado */
function rollover(){let n=0;
  S.acts.forEach(a=>{a.rolled=a.rolled||{};a.carry=a.carry||{};
    for(let w=ROLL_FROM;w<CUR;w++){const s=a.wk[w];if((s===1||s===3||s===4)&&!a.rolled[w]){
      a.wk[w]=4;a.rolled[w]=1;const nx=w+1;if(nx<=53){if(!a.wk[nx])a.wk[nx]=1;if(a.wk[nx]!==2)a.carry[nx]=a.carry[w]||w}n++}}});
  return n}
const carryOf=(a,w)=>a.carry&&a.carry[w];
const carryTag=(a,w,short)=>carryOf(a,w)&&a.wk[w]!==2?`<span class="late">${short?'↻ '+carryOf(a,w):'Atrasada da sem. '+carryOf(a,w)}</span>`:'';
/* avaliações */
function itemAvg(it,upto=CUR,from=1){const v=[];for(const w in it[1]){const x=it[1][w];if(+w<=upto&&+w>=from&&typeof x==='number')v.push(x)}return mean(v)}
function blockAvg(p,k,upto=CUR,from=1){const v=[];p[k].forEach(it=>{for(const w in it[1]){const x=it[1][w];if(+w<=upto&&+w>=from&&typeof x==='number')v.push(x)}});return mean(v)}
function pScore(p,upto=CUR,from=1){const a=blockAvg(p,'t',upto,from),b=blockAvg(p,'c',upto,from);const v=[a,b].filter(x=>x!=null);return mean(v)}
function pWeek(p,w){return pScore(p,w,w)}

let toastT;
function toast(msg,undoable){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=esc(msg)+(undoable&&UNDO.length?' <button type="button">Desfazer</button>':'');
  document.body.appendChild(t);
  const b=t.querySelector('button');if(b)b.onclick=()=>{t.remove();undo()};
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3800);
}

function pop(x,y,html,bind){

     .sort((a,b)=>(!!carryOf(b,w))-(!!carryOf(a,w))||(b.wk[w]===4)-(a.wk[w]===4)||pastPending(w,b).length-pastPending(w,a).length||a.ur-b.ur);

function agHead(L){

let painting=false,paintedN=0;
function paintCell(c){

  if((a.wk[w]||0)===v)return;setWeek(a,w,v);c.dataset.s=v;paintedN++;

  else if(cw){cw.scrollLeft=Math.max(0,(innerWidth<700?180:250)+34+(CUR+3)*28-cw.clientWidth)}
  cw&&cw.addEventListener('scroll',()=>{U._agScroll=[cw.scrollLeft,cw.scrollTop]});
  m.oninput=e=>{if(e.target.id==='fq'){U.f.q=e.target.value;clearTimeout(U._qt);U._qt=setTimeout(()=>{render();const i=document.getElementById('fq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},180)}};
  m.onchange=e=>{const k=e.target.dataset.f;if(k){U.f[k]=e.target.value;render()}};

    const br=e.target.closest('[data-br]');if(br){U.brush=+br.dataset.br;render();return}

  };

  ag.onpointerdown=e=>{const c=e.target.closest('.wk[data-a]');if(!c)return;
    if(U.brush){e.preventDefault();pushUndo('pincel no plano anual');painting=true;paintedN=0;paintCell(c)}
    else statusPop(e,actById(+c.dataset.a),+c.dataset.w,()=>{const a=actById(+c.dataset.a);c.dataset.s=a.wk[+c.dataset.w]||0;const t=document.querySelector(`[data-tot="${a.id}"]`);if(t)t.textContent=Object.keys(a.wk).length});

    else if(b.dataset.clr){let n=0;for(const w in a.wk)if(+w>=CUR&&a.wk[w]===1){delete a.wk[w];n++}drawDrawer();toast(n+' semanas planejadas removidas')}

    else if(b.dataset.dup){const c=JSON.parse(JSON.stringify(a));c.n=a.n+' (cópia)';c.wk={};DR={id:null,a:c,rf:CUR+1,rt:53,rn:1};drawDrawer();toast('Cópia criada; marque as semanas e salve')}

   <div class="months">${cnt.map(([t,d],i)=>`<button data-mo="${i}" class="${i===m?'on':''}"><small class="num">${t}</small><span class="mb"><i style="height:${(t-d)/mx*100}%;background:var(--s1)"></i><i style="height:${d/mx*100}%;background:var(--s2)"></i></span>${MON[i]}</button>`).join('')}</div></div>

/* ===== SEMANA ===== */
VIEWS.semana=()=>{
  const w=U.week,f=U.wf;
  let L=inWeek(w).filter(a=>(!f.s||a.st===f.s)&&(!f.st||a.wk[w]===+f.st));
  const done=inWeek(w).filter(a=>a.wk[w]===2).length,all=inWeek(w).length;
  const key=U.wtab==='setor'?'st':'qf';
  const groups={};L.forEach(a=>{const k=a[key]||'—';(groups[k]=groups[k]||[]).push(a)});
  const G=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  const isToday=d=>w===CUR&&d===TODAY_D;
  let body;
  if(U.wtab==='lista'){
    body=`<div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>Atividade</th><th>Local</th><th>Quem faz</th><th>Dias</th><th>Metodologia · 2º M</th><th>Máquinas · 3º M</th><th>Materiais · 4º M</th><th>Meta · 5º M</th><th>Status</th></tr></thead><tbody>
    ${L.sort((a,b)=>a.n.localeCompare(b.n,'pt')).map(a=>`<tr><td><b style="cursor:pointer" data-edit="${a.id}">${esc(a.n)}</b><div class="sub">Coordena: ${esc(a.co)}</div></td><td class="sub">${esc(a.obs[w]||a.loc||'—')}</td><td>${esc(a.qf)}</td><td class="sub">${a.days.map((v,i)=>v?DOW[i]:'').filter(Boolean).join(' ')}</td>
      ${['m2','m3','m4','m5'].map(k=>`<td class="sub" style="max-width:180px">${a[k]?esc(a[k]):'<button class="btn sm ghost" data-edit="'+a.id+'">+ cadastrar</button>'}</td>`).join('')}<td><button class="chk" data-ps="${a.id}">${pill(a.wk[w])}</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
  }else{
    body=`<div class="card"><div class="scroll"><div class="wb"><div class="wh">${U.wtab==='setor'?'SETOR':'QUEM FAZ'}</div>${DOW.map((d,i)=>`<div class="wh ${isToday(i)?'today':''}"><b>${d}</b>${fd(wDate(w,i))}</div>`).join('')}
     ${G.map(([k,arr])=>{const dn=arr.filter(a=>a.wk[w]===2).length;return `<div class="who"><b>${esc(k)}</b><small>${dn} de ${arr.length} concluídas</small></div>`+DOW.map((_,d)=>{const t=arr.filter(a=>a.days[d]).sort((x,y)=>(!!carryOf(y,w))-(!!carryOf(x,w)));const ex=U.expand[k+d];const shown=ex?t:t.slice(0,4);

AFTER.semana=()=>{const m=document.getElementById('main');

VIEWS.hoje=()=>{
  const w=U.week,d=U.day,T=dayTasks(w,d),X=S.extras.filter(x=>x.w===w&&x.d===d);

  return `<div class="phead"><div><div class="eyebrow">Plano diário · semana ${w}${w===CUR&&d===TODAY_D?' · hoje':''}</div><h1>${DOWL[d]}, ${date.getDate()} de ${MONL[date.getMonth()]}</h1></div>
   <div class="acts"><button class="btn" data-dd="-1">‹ Dia anterior</button>${!(w===CUR&&d===TODAY_D)?'<button class="btn" data-dd="0">Hoje</button>':''}<button class="btn" data-dd="1">Próximo dia ›</button></div></div>

  <div class="two"><div class="card"><div class="scroll"><table class="tbl"><thead><tr><th style="width:44px"></th><th>O que fazer hoje?</th><th>Local / observação</th><th>Quem faz</th><th>Setor</th><th style="text-align:right">Status</th></tr></thead><tbody>
   ${sorted.map(a=>{const ok=dayDone(w,a,d);return `<tr><td><button class="chk" data-tk="${a.id}" aria-label="${ok?'Desmarcar':'Marcar como feito'}"><span class="circle ${ok?'done':a.wk[w]===3?'prog':''}">${ok?ic('check'):''}</span></button></td>
     <td><b style="cursor:pointer;${ok?'color:var(--muted)':''}" data-edit="${a.id}">${esc(a.n)}</b>${carryTag(a,w)}${S.notes[w+'|'+a.id+'|'+d]?`<div class="sub">📝 ${esc(S.notes[w+'|'+a.id+'|'+d])}</div>`:''}</td><td class="sub">${esc(a.obs[w]||a.loc||'—')}</td><td>${esc(a.qf)}</td><td class="sub">${esc(a.st)}</td>
     <td style="text-align:right">${ok?'<span class="pill p2">Feito hoje</span>':`<button class="chk" data-ps="${a.id}">${pill(a.wk[w])}</button>`}</td></tr>`}).join('')}
   ${X.map(x=>`<tr><td><span class="circle done">${ic('check')}</span></td><td><b>${esc(x.n)}</b><span class="extra">fora do plano</span></td><td class="sub">${esc(x.obs||'—')}</td><td>${esc(x.qf)}</td><td class="sub">${esc(x.st)}</td><td style="text-align:right"><button class="btn sm ghost" data-rx="${x.t}">Remover</button></td></tr>`).join('')}
   ${!T.length&&!X.length?'<tr><td colspan="6" class="empty">Nada planejado para este dia.</td></tr>':''}
  </tbody></table></div><div class="foot"><span>${dn} de ${T.length} tarefas do plano feitas${X.length?' · '+X.length+' fora do plano':''}</span><span>Toque no círculo para dar baixa · o aplicativo marca aqui em tempo real</span></div></div>

AFTER.hoje=()=>{const m=document.getElementById('main');
  m.onclick=e=>{
    const dd=e.target.closest('[data-dd]');if(dd){const v=+dd.dataset.dd;if(!v){U.week=CUR;U.day=TODAY_D}else{let d=U.day+v,w=U.week;if(d<0){d=6;w--}if(d>6){d=0;w++}U.week=Math.max(1,Math.min(53,w));U.day=d}render();return}
    const dy=e.target.closest('[data-dy]');if(dy){U.day=+dy.dataset.dy;render();return}

    const ps=e.target.closest('[data-ps]');if(ps){statusPop(e,actById(+ps.dataset.ps),U.week);return}

  };

    const t=S.acts.find(a=>a.n===g('x_n'));
    S.extras.push({t:Date.now(),w:U.week,d:U.day,n:g('x_n'),qf:g('x_q'),st:g('x_s')||(t?t.st:''),obs:g('x_o')});save();render();toast('Lançado no histórico do dia')};
  f.querySelector('#x_n').onchange=e=>{const t=S.acts.find(a=>a.n===e.target.value.trim());if(t){f.querySelector('#x_s').value=t.st;if(!f.querySelector('#x_q').value)f.querySelector('#x_q').value=t.qf}};
};

VIEWS.equipe=()=>{
  const P=people().filter(p=>!U.teamF||p.st===U.teamF).map(p=>({p,s:pScore(p)})).sort((a,b)=>a.p.n.localeCompare(b.p.n,'pt'));
  if(!U.team||!pBy(U.team))U.team='Agnaldo';
  const head=`<div class="phead"><div><div class="eyebrow">${esc(S.farm)} · cargos, líderes e escore individual</div><h1>${U.org?'Organograma':'Equipe e contratos de resultados'}</h1></div>
   <div class="acts"><div class="seg"><button data-org="0" class="${U.org?'':'on'}">Lista</button><button data-org="1" class="${U.org?'on':''}">Organograma</button></div></div></div>`;
  if(U.org){
    const kids=a=>S.people.filter(p=>p.sup===a);

  }

   ${P.map(({p,s})=>{const [d,t]=weekLoad(p.a);return `<tr class="trow ${p.a===U.team?'on':''}" data-tm="${esc(p.a)}"><td><span class="av">${ini(p.n)}</span></td><td><b>${esc(p.a)}</b><div class="sub">${esc(p.n)}</div></td><td class="sub">${esc(p.cg||'—')}</td><td>${esc(p.st||'—')}</td><td class="num sub">${t?d+'/'+t:'—'}</td><td style="text-align:right">${s!=null?`<span class="score ${scCls(s)}">${nf(s)}</span>`:'<span class="sub">sem avaliação</span>'}</td></tr>`}).join('')}
  </tbody></table></div><div class="foot"><span>${P.length} colaboradores · escore = média das tarefas do contrato e dos comportamentos, semanas 28 a ${CUR}</span></div></div>
  <div class="card fs" style="gap:14px"><div style="display:flex;gap:12px;align-items:center"><span class="av" style="width:48px;height:48px;font-size:15px;background:var(--navy);color:#fff">${ini(p.n)}</span><div><h3 style="font-size:19px">${esc(p.n)}</h3><div class="sub" style="color:var(--muted);font-size:12.5px">${esc(p.cg||'Cargo não cadastrado')} · Setor ${esc(p.st||'—')}${p.sup?' · responde a '+esc(p.sup):''}</div></div></div>
   <div class="minis"><div><small>Escore individual</small><b class="num">${nf(sc)}</b></div><div><small>Tarefas do contrato</small><b class="num">${nf(ta)}</b></div><div><small>Comportamentos</small><b class="num">${nf(ca)}</b></div></div>
   ${hv.length?`<div><div class="sub" style="font-size:12px;color:var(--muted);margin-bottom:4px">Escore por semana (28 a ${CUR})</div><svg viewBox="0 0 ${hist.length*26} 70" style="width:100%;height:70px" role="img" aria-label="Escore semanal">${hist.map(([w,v],i)=>{const h=v==null?0:Math.max(3,(v-7)/3*50);return `<rect x="${i*26+4}" y="${56-h}" width="18" height="${h}" rx="3" fill="${v==null?'var(--empty)':w===CUR?'var(--navy)':'var(--s3)'}" ${v==null?'':''}><title>Sem. ${w}: ${nf(v)}</title></rect><text x="${i*26+13}" y="68" font-size="9" text-anchor="middle" fill="var(--muted)">${w}</text>`}).join('')}</svg></div>`:''}
   <div><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-size:15px">Atribuições e tarefas</h3><small class="sub" style="color:var(--muted)">média do ano</small></div>
   <div class="lines">${p.t.map(it=>{const v=itemAvg(it);return `<div class="l"><span>${esc(it[0])}</span><b class="${scCls(v)}">${v==null?'NSA':nf(v,1)}</b></div>`}).join('')||'<div class="sub" style="padding:8px 0;color:var(--muted)">Sem tarefas no contrato.</div>'}</div></div>

   <div class="acts"><label class="sel">Semana<select id="evw">${opt(Array.from({length:CUR-27},(_,i)=>[i+28,'Semana '+(i+28)]),w)}</select></label><button class="btn" data-rep="1">Repetir notas da semana ${w-1}</button><button class="btn dark" data-next="1">Salvar e ir para o próximo</button></div></div>

    ${P.map(x=>`<button data-evp="${esc(x.a)}" class="${x.a===p.a?'on':''}"><span><b>${esc(x.a)}</b><small>${esc(x.cg||'—')}</small></span>${x.a===p.a?'<small style="color:var(--s3);font-weight:700">agora</small>':`<span class="okc ${evaluated(x,w)?'y':''}">${evaluated(x,w)?ic('check'):''}</span>`}</button>`).join('')}</div>
   <div class="grid"><div class="card" style="padding:16px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h3 style="font-size:19px">${esc(p.n)}</h3><div style="color:var(--muted);font-size:12.5px">${esc(p.cg||'—')} · na semana: ${wd} de ${wt} tarefas do plano concluídas</div></div>
     <div style="display:flex;gap:22px;font-size:13px;color:var(--ink2)"><span>Escore no ano <b class="score num">${nf(pScore(p,w-1))}</b></span><span>Esta semana <b class="score num ${scCls(pWeek(p,w))}" id="wsc">${nf(pWeek(p,w))}</b></span></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
     <div class="card fs"><div style="display:flex;justify-content:space-between"><div><h3 style="font-size:16px">Atribuições e tarefas</h3><small style="color:var(--muted)">Nota de 0 a 10 · NSA quando não se aplica</small></div><small style="color:var(--muted);font-weight:600;align-self:end">MÉDIA · NOTA</small></div><div>${p.t.map((it,i)=>row(it,'t',i)).join('')||'<div class="sub" style="color:var(--muted)">Sem tarefas no contrato.</div>'}</div></div>
     <div class="card fs"><div style="display:flex;justify-content:space-between"><div><h3 style="font-size:16px">Comportamentos e atitudes</h3><small style="color:var(--muted)">Critérios escolhidos no contrato de resultados</small></div><small style="color:var(--muted);font-weight:600;align-self:end">MÉDIA · NOTA</small></div><div>${p.c.map((it,i)=>row(it,'c',i)).join('')}</div></div>
    </div></div></div>`;

AFTER.avaliacao=()=>{const m=document.getElementById('main'),p=pBy(U.evP),w=U.evW;
  m.onchange=e=>{if(e.target.id==='evw'){U.evW=+e.target.value;render();return}
    const ev=e.target.dataset.ev;if(ev){const [k,i]=ev.split('|');let v=e.target.value.trim().replace(',','.');
      if(!v)delete p[k][+i][1][w];else if(/^nsa$/i.test(v))p[k][+i][1][w]='NSA';else{let n=Math.max(0,Math.min(10,parseFloat(v)));if(isNaN(n)){e.target.value='';toast('Use uma nota de 0 a 10 ou NSA');return}p[k][+i][1][w]=n;e.target.value=n}

var SYNC={db:null,live:false,state:'local',cache:{},pend:{},busy:{},deferred:false,inflight:0,waitq:[],ro:false,got:{acts:false}};
function canon(v){if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
function actBody(a){const done={},notes={};for(const k in S.done){const [w,id]=k.split('|');if(+id===a.id)done[w]=S.done[k]}for(const k in S.notes){const [w,id,d]=k.split('|');if(+id===a.id)notes[w+'_'+d]=S.notes[k]}
  return {id:a.id,n:a.n,co:a.co||'',qf:a.qf||'',st:a.st||'',ur:a.ur,tp:a.tp,wk:a.wk,loc:a.loc||'',m2:a.m2||'',m3:a.m3||'',m4:a.m4||'',m5:a.m5||'',days:a.days,obs:a.obs||{},rolled:a.rolled||{},carry:a.carry||{},done,notes}}
function bodies(){const b={};
  S.acts.forEach(a=>b['acts/a'+a.id]=canon(actBody(a)));
  S.people.forEach((p,i)=>b['people/'+slug(p.a)]=canon({a:p.a,n:p.n,cg:p.cg||'',st:p.st||'',sup:p.sup||'',t:p.t,c:p.c,ord:i}));
  const ex={};S.extras.forEach(x=>{(ex[x.w]=ex[x.w]||[]).push(x)});for(const w in ex)b['extras/w'+w]=canon({items:ex[w]});
  b['config/main']=canon({farm:S.farm,gestor:S.gestor,sectors:S.sectors,teams:S.teams,ind:S.ind,recado:S.recado||'',crit:S.crit});
  return b}
function syncUI(){const t={live:'Ao vivo · atualiza sozinho',local:'Só neste navegador',connecting:'Conectando…',ro:'Somente leitura',off:'Sem conexão · tentando'}[SYNC.state];
  document.querySelectorAll('[data-sync]').forEach(e=>{e.textContent=t;e.dataset.st=SYNC.state;e.title=SYNC.state==='live'?'Baixas do aplicativo e mudanças de outras pessoas aparecem aqui na hora':''})}
function flush(){if(!SYNC.live||SYNC.ro)return;const b=bodies();

function queue(p,str){SYNC.pend[p]=str;if(str===null)delete SYNC.cache[p];else SYNC.cache[p]=str;run(p)}

function free(){SYNC.inflight--;const r=SYNC.waitq.shift();if(r)r()}
async function run(p){if(SYNC.busy[p])return;SYNC.busy[p]=true;
  try{while(p in SYNC.pend){const str=SYNC.pend[p];delete SYNC.pend[p];await slot();
    try{const ref=SYNC.db.doc(p);str===null?await ref.delete():await ref.set(JSON.parse(str));SYNC.state='live'}
    catch(e){
      if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){SYNC.ro=true;SYNC.state='ro';toast('Você só pode ver: peça acesso de Colaborador para salvar')}
      else if(e&&e.code==='quota_exceeded'){toast('Limite do banco atingido: exclua atividades antigas')}
      else{SYNC.state='off';await new Promise(r=>setTimeout(r,800+Math.random()*800));if(!(p in SYNC.pend))SYNC.pend[p]=str}}

const mine2=p=>(p in SYNC.pend)||SYNC.busy[p];
function scheduleRender(msg){

function fromAct(b){const a=JSON.parse(JSON.stringify(b));const wk={};for(const k in a.wk)wk[+k]=a.wk[k];a.wk=wk;const o={};for(const k in a.obs||{})o[+k]=a.obs[k];a.obs=o;const done=a.done||{},notes=a.notes||{};delete a.done;delete a.notes;return {a,done,notes}}
function applyAct(id,body){
  for(const k in S.done)if(k.split('|')[1]==String(id))delete S.done[k];
  for(const k in S.notes)if(k.split('|')[1]==String(id))delete S.notes[k];
  const i=S.acts.findIndex(x=>x.id===id);
  if(!body){if(i>=0)S.acts.splice(i,1);return null}
  const {a,done,notes}=fromAct(body);
  for(const w in done)S.done[w+'|'+id]=done[w];
  for(const k in notes){const [w,d]=k.split('_');S.notes[w+'|'+id+'|'+d]=notes[k]}
  const old=i>=0?S.acts[i]:null;if(i>=0)S.acts[i]=a;else S.acts.push(a);return old;
}

(async()=>{
  if(!window.claude||!window.claude.use){SYNC.state='local';syncUI();return}

  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db){SYNC.state='local';syncUI();return}
  SYNC.db=db;
  db.collection('acts').onSnapshot(snap=>{
    if(!SYNC.got.acts){
      if(snap.empty){if(!snap.metadata.fromCache){SYNC.state='local';syncUI()}return}
      SYNC.got.acts=true;SYNC.live=true;SYNC.state='live';
      S.acts=[];S.done={};S.notes={};
      snap.docs.forEach(d=>{const b=d.data();applyAct(b.id,b)});
      S.acts.sort((x,y)=>x.id-y.id);S.acts.forEach(a=>SYNC.cache['acts/a'+a.id]=canon(actBody(a)));
      doRoll();syncUI();scheduleRender();return}
    const msgs=[];
    snap.docChanges().forEach(ch=>{const p='acts/'+ch.doc.id;if(mine2(p))return;
      const b=ch.type==='removed'?null:ch.doc.data();const id=b?b.id:+ch.doc.id.slice(1);
      const cur=S.acts.find(x=>x.id===id);
      if(b&&cur&&canon(actBody(cur))===canon(b)){SYNC.cache[p]=canon(b);return}
      const old=applyAct(id,b);
      if(b){const a=actById(id);SYNC.cache[p]=canon(actBody(a));
        const dn=a.wk[CUR]===2&&(!old||old.wk[CUR]!==2);
        if(dn)msgs.push(`${a.n} concluída (${a.qf})`);else if(old&&old.wk[CUR]!==a.wk[CUR])msgs.push(`${a.n}: ${ST[a.wk[CUR]]||'fora da semana'}`);else msgs.push(`${a.n}: baixa ou edição recebida`)}
      else delete SYNC.cache[p]});
    S.acts.sort((x,y)=>x.id-y.id);doRoll();
    if(msgs.length)scheduleRender(msgs.length===1?'Atualizado agora: '+msgs[0]:msgs.length+' atualizações recebidas');
  },e=>{SYNC.state='off';syncUI()});
  db.collection('people').onSnapshot(snap=>{if(snap.empty)return;let ch=false;
    const L=snap.docs.map(d=>d.data()).sort((x,y)=>x.ord-y.ord);
    L.forEach(b=>{const p='people/'+slug(b.a);if(mine2(p))return;const s=canon(b);if(SYNC.cache[p]===s)return;SYNC.cache[p]=s;ch=true});
    if(ch){const keep=S.people.filter(p=>mine2('people/'+slug(p.a)));S.people=L.map(b=>{const k=keep.find(p=>p.a===b.a);if(k)return k;const {ord,...r}=JSON.parse(JSON.stringify(b));return r});scheduleRender()}});
  db.doc('config/main').onSnapshot(d=>{if(!d.exists||mine2('config/main'))return;const b=d.data(),s=canon(b);if(SYNC.cache['config/main']===s)return;SYNC.cache['config/main']=s;
    Object.assign(S,JSON.parse(JSON.stringify({farm:b.farm,gestor:b.gestor,sectors:b.sectors,teams:b.teams,ind:b.ind||{},recado:b.recado,crit:b.crit||S.crit})));scheduleRender()});
  db.collection('extras').onSnapshot(snap=>{let ch=false;const all=[];
    snap.docs.forEach(d=>{const p='extras/'+d.id;const b=d.data();if(!mine2(p)){const s=canon(b);if(SYNC.cache[p]!==s){SYNC.cache[p]=s;ch=true}}(b.items||[]).forEach(x=>all.push(x))});
    snap.docChanges().forEach(c=>{if(c.type==='removed'){delete SYNC.cache['extras/'+c.doc.id];ch=true}});
    if(ch){const localPend=S.extras.filter(x=>mine2('extras/w'+x.w));S.extras=all.filter(x=>!mine2('extras/w'+x.w)).concat(localPend);scheduleRender()}});
})();
