<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page { size: 1280px 720px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --blue: #0B3D6E;
  --green: #17A34A;
  --green-dark: #0F7A38;
  --ink: #12263A;
  --muted: #5B6B7B;
  --line: #E3E8EE;
}
body { font-family: 'Archivo', 'Segoe UI', sans-serif; }
.page {
  width: 1280px; height: 720px; position: relative; overflow: hidden;
  background: #fff; display: flex; flex-direction: column;
}
.page-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px 8px 48px;
}
.title-block .kicker {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: var(--green-dark); text-transform: uppercase; margin-bottom: 6px;
}
.title-block h1 { font-size: 30px; font-weight: 800; color: var(--blue); letter-spacing: -0.5px; }
.page-logo { height: 62px; }

.kpis {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  padding: 4px 48px 14px 48px;
}
.kpi {
  border: 1px solid var(--line); border-radius: 10px; border-top: 3px solid var(--green);
  padding: 9px 14px 8px 14px; background: #fff;
}
.kpi .lbl {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 3px;
}
.kpi .val { font-size: 22px; font-weight: 800; color: var(--blue); letter-spacing: -0.3px; }
.kpi .val small { font-size: 12px; font-weight: 600; color: var(--muted); }

.charts { display: grid; grid-template-columns: 1.3fr 0.9fr 0.8fr; gap: 28px; padding: 8px 48px 0 48px; flex: 1; }
.chart-title {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.legend { font-size: 11px; color: var(--ink); font-weight: 600; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .sw.b { background: var(--blue); }
.legend .sw.g { background: var(--green); }
svg { display: block; width: 100%; }
.axis text { font-family: 'Archivo'; font-size: 11px; fill: var(--muted); font-weight: 600; }
.vlbl { font-family: 'Archivo'; font-size: 12px; font-weight: 700; }
.vlbl.w { fill: #fff; }

.note { font-size: 10px; color: var(--muted); font-style: italic; padding: 4px 48px 0 48px; }

.page-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 48px 20px 48px; font-size: 11px; color: var(--muted);
}
.page-foot .num { font-weight: 800; color: var(--blue); font-size: 13px; }
.bottom-rule { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: var(--blue); }
.bottom-rule::after { content:''; position:absolute; bottom:4px; left:0; right:0; height:2px; background: var(--green); }
</style>
</head>
<body>
<div class="page">

  <div class="page-head">
    <div class="title-block">
      <div class="kicker">Jan – Ago · 2026</div>
      <h1>Nascimentos</h1>
    </div>
    <img class="page-logo" src="../../tmp_pbix/Report/StaticResources/RegisteredResources/Gestaup_Intelligence-0127124017850949067.png" alt="Gesta'Up Intelligence">
  </div>

  <div class="kpis">
    <div class="kpi"><div class="lbl">N° Total de Nascimentos</div><div class="val">2 <small>cab</small></div></div>
    <div class="kpi"><div class="lbl">Peso Médio ao Nascimento</div><div class="val">40,00 <small>kg</small></div></div>
  </div>

  <div class="charts">
    <div>
      <div class="chart-title">Nascimentos e peso médio por mês</div>
      <!-- só meses com registro (jun, jul): 1 cab e 40kg cada -->
      <svg viewBox="0 0 560 300" preserveAspectRatio="none">
        <line x1="20" y1="250" x2="540" y2="250" stroke="#C9D2DB" stroke-width="1"/>
        <line x1="20" y1="160" x2="540" y2="160" stroke="#EDF1F5" stroke-width="1"/>
        <line x1="20" y1="70"  x2="540" y2="70"  stroke="#EDF1F5" stroke-width="1"/>
        <rect x="110" y="205" width="110" height="45" rx="5" fill="#0B3D6E" opacity="0.92"/>
        <rect x="340" y="205" width="110" height="45" rx="5" fill="#0B3D6E" opacity="0.92"/>
        <polyline points="165,120 395,120" fill="none" stroke="#17A34A" stroke-width="2.5"/>
        <g fill="#17A34A"><circle cx="165" cy="120" r="4"/><circle cx="395" cy="120" r="4"/></g>
        <g class="vlbl w" text-anchor="middle">
          <text x="165" y="231">1</text>
          <text x="395" y="231">1</text>
        </g>
        <g class="vlbl" text-anchor="middle" fill="#0F7A38" font-size="10.5" font-weight="600">
          <text x="165" y="109">40,0 kg</text>
          <text x="395" y="109">40,0 kg</text>
        </g>
        <g class="axis" text-anchor="middle">
          <text x="165" y="272">Junho</text>
          <text x="395" y="272">Julho</text>
        </g>
      </svg>
      <div class="note" style="padding:6px 0 0 0">Exibidos apenas meses com registros.</div>
    </div>
    <div>
      <div class="chart-title">Por raça × sexo</div>
      <svg viewBox="0 0 340 300" preserveAspectRatio="none">
        <line x1="10" y1="250" x2="330" y2="250" stroke="#C9D2DB" stroke-width="1"/>
        <line x1="10" y1="160" x2="330" y2="160" stroke="#EDF1F5" stroke-width="1"/>
        <line x1="10" y1="70"  x2="330" y2="70"  stroke="#EDF1F5" stroke-width="1"/>
        <rect x="115" y="160" width="110" height="90" rx="5" fill="#17A34A" opacity="0.92"/>
        <g class="vlbl w" text-anchor="middle">
          <text x="170" y="210">2</text>
        </g>
        <g class="axis" text-anchor="middle">
          <text x="170" y="272">Nelore · Macho</text>
        </g>
        <text x="170" y="140" text-anchor="middle" font-family="Archivo" font-size="10.5" font-weight="600" fill="#5B6B7B">cabeças</text>
      </svg>
    </div>
    <div>
      <div class="chart-title">Distribuição por sexo</div>
      <svg viewBox="0 0 280 300">
        <circle cx="140" cy="140" r="80" fill="none" stroke="#17A34A" stroke-width="20"/>
        <text x="140" y="134" text-anchor="middle" font-family="Archivo" font-size="30" font-weight="800" fill="#0B3D6E">2</text>
        <text x="140" y="156" text-anchor="middle" font-family="Archivo" font-size="12" font-weight="600" fill="#5B6B7B">Macho · 100%</text>
      </svg>
    </div>
  </div>

  <div class="page-foot">
    <div>Vision'Up · Gesta'Up Intelligence</div>
    <div>@gestaup.company</div>
    <div class="num">08</div>
  </div>
  <div class="bottom-rule"></div>
</div>
</body>
</html>
