<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page { size: 1280px 720px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --blue: #0B3D6E;
  --green: #17A34A;
  --green-dark: #0F7A38;
  --red: #B0443C;
  --ink: #12263A;
  --muted: #5B6B7B;
  --line: #E3E8EE;
}
body { font-family: 'Archivo', 'Segoe UI', sans-serif; }
.page {
  width: 1280px; height: 720px; position: relative; overflow: hidden;
  background: #fff; display: flex; flex-direction: column;
}
.page-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px 8px 48px;
}
.title-block .kicker {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: var(--green-dark); text-transform: uppercase; margin-bottom: 6px;
}
.title-block h1 { font-size: 30px; font-weight: 800; color: var(--blue); letter-spacing: -0.5px; }
.page-logo { height: 62px; }

.kpis {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  padding: 4px 48px 12px 48px;
}
.kpi {
  border: 1px solid var(--line); border-radius: 10px; border-top: 3px solid var(--red);
  padding: 9px 14px 8px 14px; background: #fff;
}
.kpi .lbl {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 3px;
}
.kpi .val { font-size: 22px; font-weight: 800; color: var(--blue); letter-spacing: -0.3px; }
.kpi .val small { font-size: 12px; font-weight: 600; color: var(--muted); }

.chart1 { padding: 2px 48px 4px 48px; }
.chart-row { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; padding: 6px 48px 0 48px; flex: 1; }
.chart-title {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 2px;
}
svg { display: block; width: 100%; }
.axis text { font-family: 'Archivo'; font-size: 10.5px; fill: var(--muted); font-weight: 600; }
.vlbl { font-family: 'Archivo'; font-size: 10.5px; font-weight: 700; }
.vlbl.r { fill: var(--red); }

.page-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 48px 20px 48px; font-size: 11px; color: var(--muted);
}
.page-foot .num { font-weight: 800; color: var(--blue); font-size: 13px; }
.bottom-rule { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: var(--blue); }
.bottom-rule::after { content:''; position:absolute; bottom:4px; left:0; right:0; height:2px; background: var(--green); }
</style>
</head>
<body>
<div class="page">

  <div class="page-head">
    <div class="title-block">
      <div class="kicker">Jan – Ago · 2026</div>
      <h1>Mortes</h1>
    </div>
    <img class="page-logo" src="../../tmp_pbix/Report/StaticResources/RegisteredResources/Gestaup_Intelligence-0127124017850949067.png" alt="Gesta'Up Intelligence">
  </div>

  <div class="kpis">
    <div class="kpi"><div class="lbl">Animais Mortos</div><div class="val">13 <small>cab</small></div></div>
    <div class="kpi"><div class="lbl">@ Perdidas</div><div class="val">90 <small>@</small></div></div>
    <div class="kpi"><div class="lbl">R$ Perdidos</div><div class="val"><small>R$</small> 37.398,00</div></div>
    <div class="kpi"><div class="lbl">Tx. de Mortalidade</div><div class="val">0,91<small>%</small></div></div>
  </div>

  <div class="chart1">
    <div class="chart-title">Mortes por mês</div>
    <!-- jan–ago: 0,0,0,0,0,9,2,2; max 9 -> 130px; base y=165 -->
    <svg viewBox="0 0 1184 190" preserveAspectRatio="none">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#B0443C" stop-opacity="0.32"/>
          <stop offset="1" stop-color="#B0443C" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <line x1="0" y1="165" x2="1184" y2="165" stroke="#C9D2DB" stroke-width="1"/>
      <line x1="0" y1="100" x2="1184" y2="100" stroke="#EDF1F5" stroke-width="1"/>
      <line x1="0" y1="35"  x2="1184" y2="35"  stroke="#EDF1F5" stroke-width="1"/>
      <path d="M74,165 L222,165 L370,165 L518,165 L666,165 L814,35 L962,136 L1110,136 L1110,165 L74,165 Z" fill="url(#rg)"/>
      <polyline points="74,165 222,165 370,165 518,165 666,165 814,35 962,136 1110,136"
        fill="none" stroke="#B0443C" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#B0443C">
        <circle cx="814" cy="35" r="4"/><circle cx="962" cy="136" r="4"/><circle cx="1110" cy="136" r="4"/>
      </g>
      <g class="vlbl r" text-anchor="middle">
        <text x="814" y="25">9</text><text x="962" y="126">2</text><text x="1110" y="126">2</text>
      </g>
      <g class="axis" text-anchor="middle">
        <text x="74" y="184">Jan</text><text x="222" y="184">Fev</text><text x="370" y="184">Mar</text><text x="518" y="184">Abr</text>
        <text x="666" y="184">Mai</text><text x="814" y="184">Jun</text><text x="962" y="184">Jul</text><text x="1110" y="184">Ago</text>
      </g>
    </svg>
  </div>

  <div class="chart-row">
    <div>
      <div class="chart-title">Mortes por causa</div>
      <!-- Desconhecida=10, Acidente Ofídico=2, Infecção=1; 10->140px -->
      <svg viewBox="0 0 660 190" preserveAspectRatio="none">
        <line x1="0" y1="160" x2="660" y2="160" stroke="#C9D2DB" stroke-width="1"/>
        <line x1="0" y1="113" x2="660" y2="113" stroke="#EDF1F5" stroke-width="1"/>
        <line x1="0" y1="67"  x2="660" y2="67"  stroke="#EDF1F5" stroke-width="1"/>
        <line x1="0" y1="20"  x2="660" y2="20"  stroke="#EDF1F5" stroke-width="1"/>
        <rect x="60"  y="20"  width="130" height="140" rx="5" fill="#B0443C" opacity="0.92"/>
        <rect x="265" y="132" width="130" height="28"  rx="5" fill="#B0443C" opacity="0.92"/>
        <rect x="470" y="146" width="130" height="14"  rx="5" fill="#B0443C" opacity="0.92"/>
        <g class="vlbl r" text-anchor="middle">
          <text x="125" y="12">10</text>
          <text x="330" y="122">2</text>
          <text x="535" y="136">1</text>
        </g>
        <g class="axis" text-anchor="middle">
          <text x="125" y="180">Desconhecida</text>
          <text x="330" y="180">Acidente Ofídico</text>
          <text x="535" y="180">Infecção</text>
        </g>
      </svg>
    </div>
    <div>
      <div class="chart-title">Distribuição por categoria</div>
      <!-- r=68 C=427,3: 5-12m M 6 (46,2%)=197,3; 0-4m M 4 (30,8%)=131,4; 13-24m M 3 (23,1%)=98,6 -->
      <svg viewBox="0 0 480 190">
        <g transform="rotate(-90 150 92)">
          <circle cx="150" cy="92" r="68" fill="none" stroke="#B0443C" stroke-width="18" stroke-dasharray="197.3 230"/>
          <circle cx="150" cy="92" r="68" fill="none" stroke="#0B3D6E" stroke-width="18" stroke-dasharray="131.4 295.9" stroke-dashoffset="-197.3"/>
          <circle cx="150" cy="92" r="68" fill="none" stroke="#9FB3C8" stroke-width="18" stroke-dasharray="98.6 328.7" stroke-dashoffset="-328.7"/>
        </g>
        <text x="150" y="86" text-anchor="middle" font-family="Archivo" font-size="26" font-weight="800" fill="#0B3D6E">13</text>
        <text x="150" y="106" text-anchor="middle" font-family="Archivo" font-size="11.5" font-weight="600" fill="#5B6B7B">mortes</text>
        <g font-family="Archivo" font-size="11.5" font-weight="600" fill="#12263A">
          <rect x="272" y="48"  width="11" height="11" rx="3" fill="#B0443C"/>
          <text x="289" y="58">5 a 12 m · Macho<tspan fill="#5B6B7B" font-weight="500" dx="8">6 · 46%</tspan></text>
          <rect x="272" y="84"  width="11" height="11" rx="3" fill="#0B3D6E"/>
          <text x="289" y="94">0 a 4 m · Macho<tspan fill="#5B6B7B" font-weight="500" dx="8">4 · 31%</tspan></text>
          <rect x="272" y="120" width="11" height="11" rx="3" fill="#9FB3C8"/>
          <text x="289" y="130">13 a 24 m · Macho<tspan fill="#5B6B7B" font-weight="500" dx="8">3 · 23%</tspan></text>
        </g>
      </svg>
    </div>
  </div>

  <div class="page-foot">
    <div>Vision'Up · Gesta'Up Intelligence</div>
    <div>@gestaup.company</div>
    <div class="num">09</div>
  </div>
  <div class="bottom-rule"></div>
</div>
</body>
</html>
