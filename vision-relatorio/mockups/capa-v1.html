<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page { size: 1280px 720px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --blue: #0B3D6E;
  --blue-deep: #082F56;
  --green: #17A34A;
  --green-dark: #0F7A38;
  --ink: #12263A;
  --muted: #5B6B7B;
}
body { font-family: 'Archivo', 'Segoe UI', sans-serif; }
.page {
  width: 1280px; height: 720px; position: relative; overflow: hidden;
  background: #fff;
}
/* banda verde superior com curva suave */
.band {
  position: absolute; top: -165px; left: -5%; width: 115%; height: 215px;
  background: linear-gradient(90deg, var(--green-dark) 0%, var(--green) 60%, #2FBF63 100%);
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
/* foto diagonal à direita: régua dupla azul+verde (underlays com clip paralelo) */
.photo-wrap-blue {
  position: absolute; top: 0; right: 0; width: 592px; height: 728px;
  background: var(--blue);
  clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
}
.photo-wrap {
  position: absolute; top: 0; right: 0; width: 580px; height: 728px;
  background: var(--green);
  clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
}
.photo {
  position: absolute; top: 0; right: 0; width: 560px; height: 720px;
  object-fit: cover;
  clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
}
/* conteúdo */
.brands {
  position: absolute; top: 56px; left: 72px;
  display: flex; align-items: center; gap: 26px;
}
.brands .gestaup { height: 148px; }
.brands .divider { width: 1.5px; height: 104px; background: #D5DCE3; }
.brands .fazenda { height: 100px; }
.content {
  position: absolute; left: 72px; top: 296px; width: 620px;
}
.kicker {
  font-size: 21px; font-weight: 700; letter-spacing: 5px;
  color: var(--green-dark); text-transform: uppercase; margin-bottom: 34px;
  display: flex; align-items: center; gap: 16px;
}
.kicker::before { content: ''; width: 56px; height: 3px; background: var(--green); }
h1 {
  font-size: 74px; line-height: 1.02; font-weight: 800; color: var(--blue);
  letter-spacing: -2px; margin-bottom: 36px;
}
.meta { display: flex; align-items: center; gap: 18px; }
.pill {
  background: var(--green); color: #fff; font-weight: 700; font-size: 26px;
  border-radius: 999px; padding: 11px 40px; letter-spacing: 1px;
  box-shadow: 0 6px 18px rgba(23,163,74,.30);
}
.period { font-size: 19px; color: var(--muted); font-weight: 500; }
/* rodapé */
.footer {
  position: absolute; left: 72px; right: 600px; bottom: 40px;
  display: flex; align-items: center; justify-content: space-between;
}
.social { display: flex; align-items: center; gap: 10px; color: var(--blue); font-weight: 700; font-size: 18px; }
.social svg { width: 22px; height: 22px; }
.product { font-size: 16px; color: var(--muted); font-weight: 500; }
.product b { color: var(--blue); font-weight: 800; }
/* linhas duplas do rodapé como no original, refinadas */
.bottom-rule { position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: var(--blue); }
.bottom-rule::after { content:''; position:absolute; bottom:5px; left:0; right:0; height:3px; background: var(--green); }
</style>
</head>
<body>
<div class="page">
  <div class="band"></div>
  <div class="photo-wrap-blue"></div>
  <div class="photo-wrap"><img class="photo" src="../../apps/vision/public/assets/capa-default.png" alt=""></div>
  <div class="brands">
    <img class="gestaup" src="../../tmp_pbix/Report/StaticResources/RegisteredResources/Gestaup_Intelligence-0127124017850949067.png" alt="Gesta'Up Intelligence">
    <div class="divider"></div>
    <img class="fazenda" src="logo-guanabara.jpg" alt="Fazenda Nova Guanabara">
  </div>
  <div class="content">
    <div class="kicker">Relatório Zootécnico e Financeiro</div>
    <h1>Fazenda Nova<br>Guanabara</h1>
    <div class="meta">
      <div class="pill">2026</div>
      <div class="period">Janeiro a Agosto</div>
    </div>
  </div>
  <div class="footer">
    <div class="social">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.6" cy="6.4" r="1.3" fill="currentColor" stroke="none"/></svg>
      @gestaup.company
    </div>
    <div class="product"><b>Vision'Up</b></div>
  </div>
  <div class="bottom-rule"></div>
</div>
</body>
</html>
