<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page { size: 1280px 720px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --blue: #0B3D6E;
  --green: #17A34A;
  --green-dark: #0F7A38;
  --amber: #B8860B;
  --ink: #12263A;
  --muted: #5B6B7B;
  --line: #E3E8EE;
}
body { font-family: 'Archivo', 'Segoe UI', sans-serif; }
.page {
  width: 1280px; height: 720px; position: relative; overflow: hidden;
  background: #fff; display: flex; flex-direction: column;
}
.page-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px 8px 48px;
}
.title-block .kicker {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  color: var(--green-dark); text-transform: uppercase; margin-bottom: 6px;
}
.title-block h1 { font-size: 30px; font-weight: 800; color: var(--blue); letter-spacing: -0.5px; }
.page-logo { height: 62px; }

.kpis {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  padding: 4px 48px 12px 48px;
}
.kpi {
  border: 1px solid var(--line); border-radius: 10px; border-top: 3px solid var(--amber);
  padding: 9px 14px 8px 14px; background: #fff;
}
.kpi .lbl {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 3px;
}
.kpi .val { font-size: 22px; font-weight: 800; color: var(--blue); letter-spacing: -0.3px; }
.kpi .val small { font-size: 12px; font-weight: 600; color: var(--muted); }

.chart1 { padding: 2px 48px 4px 48px; }
.chart-row { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; padding: 6px 48px 0 48px; flex: 1; }
.chart-title {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 2px;
}
svg { display: block; width: 100%; }
.axis text { font-family: 'Archivo'; font-size: 10.5px; fill: var(--muted); font-weight: 600; }
.vlbl { font-family: 'Archivo'; font-size: 10.5px; font-weight: 700; fill: #8F6708; }

.page-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 48px 20px 48px; font-size: 11px; color: var(--muted);
}
.page-foot .num { font-weight: 800; color: var(--blue); font-size: 13px; }
.bottom-rule { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: var(--blue); }
.bottom-rule::after { content:''; position:absolute; bottom:4px; left:0; right:0; height:2px; background: var(--green); }
</style>
</head>
<body>
<div class="page">

  <div class="page-head">
    <div class="title-block">
      <div class="kicker">Jan – Ago · 2026</div>
      <h1>Consumo e Doações</h1>
    </div>
    <img class="page-logo" src="../../tmp_pbix/Report/StaticResources/RegisteredResources/Gestaup_Intelligence-0127124017850949067.png" alt="Gesta'Up Intelligence">
  </div>

  <div class="kpis">
    <div class="kpi"><div class="lbl">Total de Animais</div><div class="val">5 <small>cab</small></div></div>
    <div class="kpi"><div class="lbl">@ Destinadas</div><div class="val">60 <small>@</small></div></div>
    <div class="kpi"><div class="lbl">R$ Destinados</div><div class="val"><small>R$</small> 23.903,00</div></div>
    <div class="kpi"><div class="lbl">Tx. de Consumo e Doações</div><div class="val">0,35<small>%</small></div></div>
  </div>

  <div class="chart1">
    <div class="chart-title">Consumo e doações por mês</div>
    <!-- jan–ago: jun=4, jul=1; max 4 -> 130px; base y=165 -->
    <svg viewBox="0 0 1184 190" preserveAspectRatio="none">
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#B8860B" stop-opacity="0.30"/>
          <stop offset="1" stop-color="#B8860B" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <line x1="0" y1="165" x2="1184" y2="165" stroke="#C9D2DB" stroke-width="1"/>
      <line x1="0" y1="100" x2="1184" y2="100" stroke="#EDF1F5" stroke-width="1"/>
      <line x1="0" y1="35"  x2="1184" y2="35"  stroke="#EDF1F5" stroke-width="1"/>
      <path d="M74,165 L222,165 L370,165 L518,165 L666,165 L814,35 L962,133 L1110,165 L1110,165 L74,165 Z" fill="url(#ag)"/>
      <polyline points="74,165 222,165 370,165 518,165 666,165 814,35 962,133 1110,165"
        fill="none" stroke="#B8860B" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#B8860B">
        <circle cx="814" cy="35" r="4"/><circle cx="962" cy="133" r="4"/>
      </g>
      <g class="vlbl" text-anchor="middle">
        <text x="814" y="25">4</text><text x="962" y="123">1</text>
      </g>
      <g class="axis" text-anchor="middle">
        <text x="74" y="184">Jan</text><text x="222" y="184">Fev</text><text x="370" y="184">Mar</text><text x="518" y="184">Abr</text>
        <text x="666" y="184">Mai</text><text x="814" y="184">Jun</text><text x="962" y="184">Jul</text><text x="1110" y="184">Ago</text>
      </g>
    </svg>
  </div>

  <div class="chart-row">
    <div>
      <div class="chart-title">Por destino</div>
      <!-- Cantina=4 (140px), Funcionários=1 (35px); base y=160 -->
      <svg viewBox="0 0 660 190" preserveAspectRatio="none">
        <line x1="0" y1="160" x2="660" y2="160" stroke="#C9D2DB" stroke-width="1"/>
        <line x1="0" y1="113" x2="660" y2="113" stroke="#EDF1F5" stroke-width="1"/>
        <line x1="0" y1="67"  x2="660" y2="67"  stroke="#EDF1F5" stroke-width="1"/>
        <line x1="0" y1="20"  x2="660" y2="20"  stroke="#EDF1F5" stroke-width="1"/>
        <rect x="140" y="20"  width="130" height="140" rx="5" fill="#B8860B" opacity="0.92"/>
        <rect x="390" y="125" width="130" height="35"  rx="5" fill="#B8860B" opacity="0.92"/>
        <g class="vlbl" text-anchor="middle">
          <text x="205" y="12">4</text>
          <text x="455" y="115">1</text>
        </g>
        <g class="axis" text-anchor="middle">
          <text x="205" y="180">Cantina</text>
          <text x="455" y="180">Funcionários</text>
        </g>
      </svg>
    </div>
    <div>
      <div class="chart-title">Distribuição por categoria</div>
      <svg viewBox="0 0 480 190">
        <circle cx="240" cy="92" r="68" fill="none" stroke="#B8860B" stroke-width="18"/>
        <text x="240" y="86" text-anchor="middle" font-family="Archivo" font-size="26" font-weight="800" fill="#0B3D6E">5</text>
        <text x="240" y="106" text-anchor="middle" font-family="Archivo" font-size="11.5" font-weight="600" fill="#5B6B7B">13 a 24 m · Macho</text>
        <text x="240" y="122" text-anchor="middle" font-family="Archivo" font-size="10.5" font-weight="500" fill="#5B6B7B">100%</text>
      </svg>
    </div>
  </div>

  <div class="page-foot">
    <div>Vision'Up · Gesta'Up Intelligence</div>
    <div>@gestaup.company</div>
    <div class="num">10</div>
  </div>
  <div class="bottom-rule"></div>
</div>
</body>
</html>
